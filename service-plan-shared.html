<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plano de Serviço - W.Tracks</title>
    <meta name="description" content="Visualize plano de serviço compartilhado">
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="mobile.css" media="(max-width: 768px)">
    <link rel="icon" type="image/png" href="icon-black-transparent.png">
    <link rel="stylesheet" href="service-plan.css">

    <!-- Firebase SDK -->
    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
      import { getFirestore, collection, getDocs, query, orderBy, addDoc, updateDoc, deleteDoc, doc, serverTimestamp, where, setDoc, getDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
      import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

      const firebaseConfig = {
        apiKey: "AIzaSyDW6P_V4_LRLRg6-FEe2E7QJa9J3oidY5g",
        authDomain: "wtracks-acff8.firebaseapp.com",
        projectId: "wtracks-acff8",
        storageBucket: "wtracks-acff8.firebasestorage.app",
        messagingSenderId: "719838064855",
        appId: "1:719838064855:web:3c0631a882aac30cf3c092"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      window.firebaseDB = {
        db,
        collection,
        getDocs,
        query,
        orderBy,
        addDoc,
        updateDoc,
        deleteDoc,
        doc,
        serverTimestamp,
        where,
        setDoc,
        getDoc,
        onSnapshot
      };

      window.firebaseAuth = {
        auth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged,
        GoogleAuthProvider,
        signInWithPopup
      };

      console.log('[SERVICE PLAN SHARED] Firebase initialized (Firestore + Auth + Google)');
    </script>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <img src="icon-white-transparent.png" alt="W.Tracks" class="logo-icon">
                <span class="logo-text">W.Tracks</span>
            </div>
            
            <nav class="nav">
                <a href="index.html" class="nav-link">Biblioteca</a>
                <a href="index.html" class="nav-link">Comunidade</a>
            </nav>
        </div>
    </header>

    <!-- PAGE HEADER -->
    <section class="page-header-section">
        <div class="page-header-container">
        </div>
    </section>

    <!-- CALENDAR (SHARED MODE - NO MONTH CAROUSEL) -->
    <section class="calendar-section" id="calendarSection">
        <div class="calendar-container">
            <div class="calendar-header">
                <h2 class="calendar-title" id="calendarTitle">September 2025</h2>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                <!-- Calendar will be generated by JavaScript -->
            </div>
            
            <!-- Loading State -->
            <div class="loading-text" id="loadingText" style="display: none;">Carregando Service Plans...</div>
        </div>
    </section>

    <!-- SIDE PANEL (SHARED MODE - READ ONLY) -->
    <div class="side-panel-overlay" id="sidePanelOverlay">
        <div class="side-panel" id="sidePanel">
            <div class="side-panel-header">
                <button class="side-panel-close" id="closeSidePanel" aria-label="Fechar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            
            <div class="side-panel-content">
                <!-- Date Display -->
                <div class="side-panel-date-section">
                    <h2 class="side-panel-date" id="sidePanelDate">20 de Setembro de 2026</h2>
                    <p class="side-panel-day-name" id="sidePanelDayName">Domingo</p>
                </div>

                <!-- Service Plan Editor (READ ONLY - MUSIC ONLY) -->
                <div class="side-panel-editor-section" id="sidePanelEditorSection" style="display: none;">
                    <button class="side-panel-back-btn" id="sidePanelBackBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                        VOLTAR
                    </button>
                    
                    <h2 class="side-panel-service-plan-name" id="sidePanelEditorPlanName">Culto de Domingo</h2>
                    
                    <div class="side-panel-items-container" id="sidePanelItemsContainer">
                        <!-- Items will be rendered here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="service-plan-shared.js"></script>
</body>
</html>
