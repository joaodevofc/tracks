<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Central de Ajuda - W.Tracks</title>
    <meta name="description" content="Central de ajuda e documentação do W.Tracks">
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="mobile.css" media="(max-width: 768px)">
    <link rel="icon" type="image/png" href="icon-black-transparent.png">
    
    <style>
        /* ========================================
           CENTRAL DE AJUDA - ESTILOS ESPECÍFICOS
           ======================================== */
        
        .help-center {
            min-height: 100vh;
            background: var(--color-black);
            padding-top: 60px;
        }
        
        .help-header {
            background: var(--color-black-elevated);
            border-bottom: 1px solid var(--border-subtle);
            padding: var(--spacing-xl) var(--spacing-2xl);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        
        .help-header-content {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .help-title {
            font-size: var(--font-size-3xl);
            font-weight: 700;
            color: var(--color-white);
            margin-bottom: var(--spacing-lg);
            letter-spacing: -0.02em;
        }
        
        .help-search-container {
            position: relative;
            max-width: 600px;
        }
        
        .help-search-input {
            width: 100%;
            padding: var(--spacing-md) var(--spacing-lg);
            padding-left: 48px;
            background: var(--color-black-card);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-lg);
            color: var(--color-white);
            font-size: var(--font-size-base);
            font-family: var(--font-family);
            outline: none;
            transition: all var(--transition-fast);
        }
        
        .help-search-input:focus {
            border-color: var(--border-strong);
            background: var(--color-black-hover);
        }
        
        .help-search-input::placeholder {
            color: var(--color-white-muted);
        }
        
        .help-search-icon {
            position: absolute;
            left: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-white-muted);
            pointer-events: none;
        }
        
        .help-search-icon svg {
            width: 20px;
            height: 20px;
        }
        
        .help-search-results {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--color-black-elevated);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            max-height: 400px;
            overflow-y: auto;
            display: none;
            z-index: 100;
        }
        
        .help-search-results.active {
            display: block;
        }
        
        .help-search-result-item {
            padding: var(--spacing-md) var(--spacing-lg);
            border-bottom: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: background var(--transition-fast);
        }
        
        .help-search-result-item:hover {
            background: var(--color-black-hover);
        }
        
        .help-search-result-item:last-child {
            border-bottom: none;
        }
        
        .help-result-title {
            font-size: var(--font-size-base);
            font-weight: 600;
            color: var(--color-white);
            margin-bottom: var(--spacing-xs);
        }
        
        .help-result-topic {
            font-size: var(--font-size-sm);
            color: var(--color-accent);
            margin-bottom: var(--spacing-xs);
        }
        
        .help-result-excerpt {
            font-size: var(--font-size-sm);
            color: var(--color-white-muted);
            line-height: 1.4;
        }
        
        .help-no-results {
            padding: var(--spacing-xl);
            text-align: center;
            color: var(--color-white-muted);
        }
        
        .help-main-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 0;
            min-height: calc(100vh - 200px);
        }
        
        .help-sidebar {
            width: 280px;
            background: var(--color-black-elevated);
            border-right: 1px solid var(--border-subtle);
            padding: var(--spacing-lg);
            position: sticky;
            top: 60px;
            height: calc(100vh - 60px);
            overflow-y: auto;
            flex-shrink: 0;
        }
        
        .help-sidebar-section {
            margin-bottom: var(--spacing-lg);
        }
        
        .help-sidebar-title {
            font-size: var(--font-size-sm);
            font-weight: 600;
            color: var(--color-white-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: var(--spacing-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }
        
        .help-sidebar-title:hover {
            color: var(--color-white);
        }
        
        .help-sidebar-title svg {
            width: 16px;
            height: 16px;
            transition: transform var(--transition-fast);
        }
        
        .help-sidebar-title.expanded svg {
            transform: rotate(180deg);
        }
        
        .help-sidebar-questions {
            display: none;
            margin-left: var(--spacing-sm);
        }
        
        .help-sidebar-questions.expanded {
            display: block;
        }
        
        .help-sidebar-question {
            display: block;
            padding: var(--spacing-sm) var(--spacing-md);
            color: var(--color-white-muted);
            font-size: var(--font-size-sm);
            border-radius: var(--radius-sm);
            margin-bottom: var(--spacing-xs);
            transition: all var(--transition-fast);
            cursor: pointer;
        }
        
        .help-sidebar-question:hover {
            background: var(--color-black-hover);
            color: var(--color-white);
        }
        
        .help-sidebar-question.active {
            background: var(--color-accent);
            color: var(--color-black);
            font-weight: 500;
        }
        
        .help-content {
            flex: 1;
            padding: var(--spacing-2xl) var(--spacing-3xl);
            max-width: 900px;
        }
        
        .help-article {
            display: none;
        }
        
        .help-article.active {
            display: block;
        }
        
        .help-article-title {
            font-size: var(--font-size-2xl);
            font-weight: 700;
            color: var(--color-white);
            margin-bottom: var(--spacing-lg);
            line-height: 1.3;
        }
        
        .help-article-content {
            color: var(--color-white-dim);
            line-height: 1.8;
            font-size: var(--font-size-base);
        }
        
        .help-article-content p {
            margin-bottom: var(--spacing-lg);
        }
        
        .help-article-content h3 {
            font-size: var(--font-size-lg);
            font-weight: 600;
            color: var(--color-white);
            margin: var(--spacing-xl) 0 var(--spacing-md);
        }
        
        .help-article-content ul {
            margin: var(--spacing-md) 0 var(--spacing-lg);
            padding-left: var(--spacing-lg);
        }
        
        .help-article-content li {
            margin-bottom: var(--spacing-sm);
            color: var(--color-white-dim);
        }
        
        .help-article-content strong {
            color: var(--color-white);
            font-weight: 600;
        }
        
        .help-article-content code {
            background: var(--color-black-card);
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            font-family: 'Courier New', monospace;
            font-size: var(--font-size-sm);
        }
        
        .help-article-content .warning-box {
            background: rgba(255, 59, 47, 0.1);
            border: 1px solid rgba(255, 59, 47, 0.3);
            border-radius: var(--radius-md);
            padding: var(--spacing-md) var(--spacing-lg);
            margin: var(--spacing-lg) 0;
        }
        
        .help-article-content .warning-box strong {
            color: #ff3b2f;
        }
        
        .help-article-content .info-box {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: var(--radius-md);
            padding: var(--spacing-md) var(--spacing-lg);
            margin: var(--spacing-lg) 0;
        }
        
        .help-article-content .info-box strong {
            color: #60a5fa;
        }
        
        .help-contact-section {
            margin-top: var(--spacing-3xl);
            padding: var(--spacing-2xl);
            background: var(--color-black-elevated);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-lg);
            text-align: center;
        }
        
        .help-contact-title {
            font-size: var(--font-size-xl);
            font-weight: 600;
            color: var(--color-white);
            margin-bottom: var(--spacing-md);
        }
        
        .help-contact-text {
            color: var(--color-white-muted);
            margin-bottom: var(--spacing-lg);
        }
        
        .help-contact-btn {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md) var(--spacing-xl);
            background: var(--color-accent);
            color: var(--color-black);
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: var(--font-size-base);
            transition: all var(--transition-fast);
        }
        
        .help-contact-btn:hover {
            background: var(--color-white);
            transform: translateY(-2px);
        }
        
        .help-back-btn {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            color: var(--color-white-muted);
            font-size: var(--font-size-sm);
            margin-bottom: var(--spacing-lg);
            cursor: pointer;
            transition: color var(--transition-fast);
        }
        
        .help-back-btn:hover {
            color: var(--color-white);
        }
        
        .help-back-btn svg {
            width: 16px;
            height: 16px;
        }
        
        /* Mobile Menu Toggle */
        .help-mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 70px;
            left: var(--spacing-md);
            z-index: 60;
            background: var(--color-black-elevated);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            padding: var(--spacing-sm) var(--spacing-md);
            color: var(--color-white);
            font-size: var(--font-size-sm);
            cursor: pointer;
            align-items: center;
            gap: var(--spacing-sm);
        }
        
        .help-mobile-menu-toggle svg {
            width: 16px;
            height: 16px;
        }
        
        /* MOBILE STYLES */
        @media (max-width: 768px) {
            .help-header {
                padding: var(--spacing-lg) var(--spacing-md);
            }
            
            .help-title {
                font-size: var(--font-size-2xl);
            }
            
            .help-search-container {
                max-width: 100%;
            }
            
            .help-main-container {
                flex-direction: column;
            }
            
            .help-sidebar {
                width: 100%;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 100vh;
                z-index: 200;
                transform: translateX(-100%);
                transition: transform var(--transition-normal);
                border-right: none;
            }
            
            .help-sidebar.open {
                transform: translateX(0);
            }
            
            .help-mobile-menu-toggle {
                display: flex;
            }
            
            .help-content {
                padding: var(--spacing-lg) var(--spacing-md);
            }
            
            .help-article-title {
                font-size: var(--font-size-xl);
            }
            
            .help-contact-section {
                padding: var(--spacing-lg);
            }
            
            .help-contact-btn {
                width: 100%;
                justify-content: center;
            }
        }
        
        /* Overlay for mobile sidebar */
        .help-sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 150;
        }
        
        .help-sidebar-overlay.active {
            display: block;
        }
        
        @media (max-width: 768px) {
            .help-sidebar-overlay.active {
                display: block;
            }
        }
    </style>
</head>
<body>

    <header class="header">

    <div class="help-center">

        <div class="help-header">

                <div class="help-search-container">
                    <div class="help-search-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>

    <script>
        // ========================================
        // DADOS DA CENTRAL DE AJUDA
        // ========================================
        const helpData = {
            topics: [
                {
                    id: 'conta-login',
                    title: 'Conta e Login',
                    questions: [
                        {
                            id: 'criar-conta',
                            title: 'Como criar uma conta?',
                            content: `
                                <p>Criar uma conta no W.Tracks é o primeiro passo para começar a usar todos os recursos da plataforma. A conta serve como sua identidade digital dentro do sistema — é através dela que seus projetos, configurações e preferências ficam salvos e associados a você, permitindo que você acesse tudo de qualquer dispositivo.</p>
                                
                                <h3>Processo de criação de conta</h3>
                                <p>Para criar sua conta, siga estes passos:</p>
                                <ul>
                                    <li>Acesse o site do W.Tracks e clique no botão de perfil no canto superior direito da tela</li>
                                    <li>Selecione a opção "Criar conta" no menu que aparecer</li>
                                    <li>Preencha seu endereço de e-mail — este será seu identificador principal e também o canal para comunicações importantes</li>
                                    <li>Crie uma senha segura, preferencialmente com letras maiúsculas, minúsculas, números e caracteres especiais</li>
                                    <li>Confirme a criação da conta através do e-mail de verificação que será enviado para você</li>
                                </ul>
                                
                                <h3>Por que a verificação por e-mail?</h3>
                                <p>O envio do e-mail de verificação é uma medida de segurança importante. Ele garante que você realmente tem acesso ao endereço de e-mail informado, o que evita que outras pessoas criem contas usando seu e-mail sem sua permissão. Além disso, esse processo confirma que o e-mail está funcionando corretamente, garantindo que você possa receber recuperações de senha e outras comunicações importantes no futuro.</p>
                                
                                <h3>E se eu não receber o e-mail de verificação?</h3>
                                <p>Caso não receba o e-mail de verificação dentro de alguns minutos, verifique primeiro sua pasta de spam ou lixo eletrônico — às vezes o sistema de e-mail pode classificar mensagens automáticas como spam. Se ainda assim não encontrar, tente solicitar um novo e-mail de verificação. Certifique-se também de que digitou o endereço de e-mail corretamente durante o cadastro.</p>
                                
                                <h3>Após a confirmação</h3>
                                <p>Depois de confirmar sua conta através do link no e-mail, você já pode fazer login e começar a usar o W.Tracks imediatamente. Seu perfil será criado com configurações padrão, que você pode personalizar depois nas configurações da conta. Lembre-se de guardar suas credenciais em local seguro e nunca compartilhar sua senha com outras pessoas.</p>
                            `
                        },
                        {
                            id: 'fazer-login',
                            title: 'Como fazer login?',
                            content: `
                                <p>Fazer login no W.Tracks é o processo que autentica sua identidade e dá acesso a todos os seus projetos e configurações salvos. O login é necessário porque o sistema precisa saber quem é você para mostrar apenas seus projetos, manter suas preferências pessoais e permitir que você use recursos que dependem de uma conta ativa.</p>
                                
                                <h3>Como acessar sua conta</h3>
                                <p>Para fazer login, siga estes passos:</p>
                                <ul>
                                    <li>Abra o site do W.Tracks no seu navegador</li>
                                    <li>Clique no botão de perfil no canto superior direito da tela</li>
                                    <li>Insira o endereço de e-mail que você usou para criar a conta</li>
                                    <li>Digite sua senha</li>
                                    <li>Clique no botão "Entrar" para completar o processo</li>
                                </ul>
                                
                                <h3>Como funciona a sessão de login</h3>
                                <p>Após fazer login, você permanecerá autenticado enquanto não clicar em "Sair" nas configurações do perfil. Isso significa que você pode fechar o navegador, desligar o computador e voltar depois — o sistema se lembrará de você através de um acesso temporário seguro que fica salvo no seu dispositivo. Esse acesso temporário pode expirar após um período de inatividade por segurança, o que é normal e exige apenas um novo login.</p>
                                
                                <h3>Funciona em qualquer dispositivo?</h3>
                                <p>Sim, você pode fazer login no W.Tracks de qualquer dispositivo — computador, tablet ou celular — usando as mesmas credenciais (e-mail e senha). Ao fazer login em um novo dispositivo, você terá acesso a todos os seus projetos e configurações, pois eles ficam salvos na nuvem associados à sua conta, não ao aparelho específico.</p>
                                
                                <h3>Problemas com login</h3>
                                <p>Se você tiver dificuldade para fazer login, verifique primeiro se está digitando o e-mail e a senha corretamente, observando maiúsculas e minúsculas. Se esqueceu sua senha, use a opção "Esqueceu a senha?" na tela de login para iniciar o processo de recuperação. Se o problema persistir, pode ser que sua conta tenha sido temporariamente bloqueada por tentativas incorretas — nesse caso, aguarde alguns minutos antes de tentar novamente.</p>
                            `
                        },
                        {
                            id: 'recuperar-senha',
                            title: 'Esqueci minha senha. Como recuperar?',
                            content: `
                                <p>Esquecer a senha é uma situação comum e o W.Tracks possui um processo seguro para ajudá-lo a recuperar o acesso à sua conta. Por motivos de segurança, não é possível ver sua senha atual — o sistema apenas permite criar uma nova senha através de um processo de verificação que confirma que você é o titular da conta.</p>
                                
                                <h3>Processo de recuperação de senha</h3>
                                <p>Para recuperar sua senha, siga estes passos:</p>
                                <ul>
                                    <li>Na tela de login, clique no link "Esqueceu a senha?" abaixo do campo de senha</li>
                                    <li>Insira o endereço de e-mail cadastrado na sua conta</li>
                                    <li>Verifique sua caixa de entrada para um e-mail com o link de redefinição</li>
                                    <li>Clique no link desse e-mail — ele levará você a uma página segura onde poderá criar uma nova senha</li>
                                    <li>Digite sua nova senha, confirme e salve as alterações</li>
                                </ul>
                                
                                <h3>Por que o link expira?</h3>
                                <p>O link de redefinição de senha expira em 24 horas por segurança. Isso impede que alguém que tenha acesso antigo ao seu e-mail possa usar um link antigo para redefinir sua senha sem seu conhecimento. Se o link expirar antes de você usá-lo, basta solicitar um novo link de redefinição — o processo é o mesmo.</p>
                                
                                <h3>E se eu não receber o e-mail?</h3>
                                <p>Caso não receba o e-mail de redefinição dentro de alguns minutos, verifique sua pasta de spam ou lixo eletrônico. Se não estiver lá, confirme que você digitou o e-mail corretamente — lembre-se de usar o mesmo endereço que cadastrou na conta. Se o problema persistir, pode haver algum problema temporário com o envio de e-mails; tente novamente após alguns minutos.</p>
                                
                                <h3> Criando uma senha segura</h3>
                                <p>Ao criar sua nova senha, siga as boas práticas de segurança: use pelo menos 8 caracteres, combine letras maiúsculas e minúsculas, inclua números e caracteres especiais, e evite usar informações óbvias como datas de aniversário ou nomes de familiares. Não reutilize senhas de outros sites, pois isso pode comprometer a segurança de múltiplas contas se uma delas for comprometida.</p>
                                
                                <h3>Após redefinir a senha</h3>
                                <p>Depois de redefinir sua senha com sucesso, você poderá fazer login imediatamente usando a nova senha. Sua sessão antiga em outros dispositivos será encerrada automaticamente por segurança, então você precisará fazer login novamente em cada aparelho onde usa o W.Tracks. Isso protege sua conta caso alguém tenha tido acesso à sua senha antiga.</p>
                            `
                        },
                        {
                            id: 'por-que-login',
                            title: 'Por que preciso estar logado?',
                            content: `
                                <p>O login no W.Tracks não é apenas uma formalidade — ele é fundamental para o funcionamento da plataforma e para a sua experiência como usuário. Sem estar logado, o sistema não consegue associar suas ações a uma identidade específica, o que torna impossível salvar projetos, manter configurações personalizadas ou oferecer uma experiência personalizada.</p>
                                
                                <h3>Salvamento de projetos e músicas</h3>
                                <p>A principal razão para o login é permitir que seus projetos e músicas sejam salvos na nuvem associados à sua conta. Quando você cria um projeto, adiciona músicas, configura o mixer e ajusta preferências, tudo isso fica vinculado ao seu perfil de usuário. Sem login, qualquer trabalho que você fizesse seria perdido ao fechar o navegador, pois não haveria como saber a quem aquele projeto pertence.</p>
                                
                                <h3>Acesso multi-dispositivo</h3>
                                <p>Estar logado também é essencial para acessar seus projetos de qualquer dispositivo. Como seus dados ficam salvos na nuvem associados à sua conta, você pode começar um projeto no computador, continuar no tablet e finalizar no celular — basta fazer login com as mesmas credenciais em cada aparelho. Sem login, cada dispositivo funcionaria de forma isolada, sem compartilhar dados entre si.</p>
                                
                                <h3>Configurações personalizadas</h3>
                                <p>Suas preferências pessoais — como volume padrão, configurações de mixer, organização da biblioteca e outras escolhas — ficam salvas na sua conta. Isso significa que quando você faz login em um novo dispositivo, o W.Tracks se configura automaticamente de acordo com suas preferências, sem precisar reconfigurar tudo manualmente. Essa personalização só é possível porque o sistema sabe quem é você através do login.</p>
                                
                                <h3>Recursos avançados</h3>
                                <p>Muitos recursos avançados do W.Tracks dependem de uma conta ativa. A sincronização entre dispositivos, por exemplo, só funciona se você estiver logado, pois o sistema precisa saber quais projetos pertencem a você para sincronizá-los corretamente. Recursos de colaboração, compartilhamento e funcionalidades premium também requerem identificação do usuário.</p>
                                
                                <h3>Segurança e privacidade</h3>
                                <p>O login também protege sua privacidade e a de outros usuários. Ao exigir autenticação, o W.Tracks garante que cada pessoa só tenha acesso aos próprios projetos e configurações. Sem login, qualquer pessoa poderia acessar projetos de outros usuários, o que violaria a privacidade e a segurança dos dados de todos.</p>
                                
                                <h3>Limitações sem login</h3>
                                <p>Embora o W.Tracks permita explorar algumas funcionalidades sem login, a experiência é limitada. Você não conseguirá salvar projetos de forma permanente, suas configurações não serão mantidas entre sessões, e muitos recursos estarão indisponíveis. Para aproveitar plenamente tudo que o W.Tracks oferece, o login é indispensável.</p>
                            `
                        }

                                <h3>Formatos suportados</h3>
                                <p>O W.Tracks suporta os principais formatos de áudio, incluindo MP3, WAV, FLAC, AAC e outros. Se você tiver arquivos em formatos menos comuns, tente convertê-los para um dos formatos mais populares antes de adicionar ao projeto. A qualidade do áudio é preservada durante o processamento, então você não precisa se preocupar com perda de qualidade.</p>

                                <p>Editar um projeto no W.Tracks envolve modificar suas informações básicas — como nome, capa e descrição — e também pode incluir ajustes nas configurações do projeto. Diferente de editar o conteúdo das tracks (que é feito no mixer), editar o projeto significa alterar os metadados e configurações que definem como o projeto aparece na sua biblioteca e como ele se comporta.</p>
                                
                                <h3>Informações básicas do projeto</h3>
                                <p>Para editar as informações básicas do projeto:</p>
                                <ul>
                                    <li>Na biblioteca de projetos, encontre o projeto que deseja editar</li>
                                    <li>Passe o mouse sobre o card do projeto para revelar os botões de ação</li>
                                    <li>Clique no ícone de edição (geralmente representado por um lápis)</li>
                                    <li>Uma janela ou painel se abrirá com as informações editáveis do projeto</li>

                                    <li>Adicione ou edite a descrição do projeto para ajudar a identificá-lo depois</li>

                                </ul>
                                
                                <h3>Por que editar as informações do projeto?</h3>
                                <p>Manter as informações do projeto atualizadas é importante para organização, especialmente quando você tem muitos projetos. Nomes descritivos ajudam a encontrar projetos específicos rapidamente, e capas visuais tornam a biblioteca mais agradável e fácil de navegar. Descrições podem conter informações úteis como tempo, tom, instrumentos usados ou notas sobre o arranjo.</p>
                                
                                <h3>Capas e imagens do projeto</h3>
                                <p>A capa do projeto serve como identificação visual rápida. Você pode usar qualquer imagem — foto da banda, arte do álbum, ou algo criado especificamente para o projeto. Imagens muito grandes podem demorar mais para carregar, então tente usar imagens otimizadas para web. O W.Tracks aceita os principais formatos de imagem (JPG, PNG, etc.).</p>
                                
                                <h3>Configurações avançadas do projeto</h3>
                                <p>Além das informações básicas, alguns projetos podem ter configurações avançadas dependendo do seu plano e dos recursos que está usando. Isso pode incluir configurações de privacidade (se o projeto é público ou privado), permissões de compartilhamento, configurações de sincronização e outras opções específicas do tipo de projeto.</p>
                                
                                <h3>Salvamento automático</h3>

                                <h3>Uso de memória e armazenamento</h3>
                                <p>É importante considerar que duplicar um projeto consome espaço adicional, pois os arquivos de áudio são copiados. Se o projeto original tem tracks grandes, a duplicação dobrará o uso de armazenamento para aquele conteúdo. Se você tem muitos projetos grandes, fique atento aos limites de armazenamento do seu plano.</p>
                                
                                <h3>Cenários de uso da duplicação</h3>

                                <p>Excluir um projeto remove-o permanentemente da sua biblioteca e dos servidores do W.Tracks. Isso é diferente de arquivar ou esconder um projeto — a exclusão é definitiva. Por isso, é importante entender completamente o que acontece antes de prosseguir.</p>
                                
                                <h3>Processo de exclusão</h3>

                                    <li>Clique no menu de opções (geralmente representado por três pontos ou ícone de menu)</li>

                                    <li>O sistema mostrará uma mensagem de confirmação avisando que a ação é permanente</li>
                                    <li>Leia atentamente a mensagem de confirmação e clique em "Confirmar" se tiver certeza</li>
                                    <li>O projeto será removido da sua biblioteca e de todos os dispositivos onde estava sincronizado</li>
                                </ul>
                                
                                <h3>O que é excluído exatamente?</h3>
                                <p>Quando você exclui um projeto, tudo relacionado a ele é removido permanentemente:</p>
                                <ul>
                                    <li>O projeto em si desaparece da sua biblioteca</li>
                                    <li>Todas as tracks associadas ao projeto são excluídas</li>
                                    <li>Os arquivos de áudio das tracks são removidos dos servidores</li>
                                    <li>Configurações do mixer, efeitos e preferências específicas do projeto são perdidas</li>
                                    <li>Capa, descrição e outros metadados são eliminados</li>

                                <h3>Por que a exclusão é permanente?</h3>
                                <p>A exclusão permanente é uma medida de segurança e privacidade. Se os projetos pudessem ser recuperados facilmente após a exclusão, isso representaria um risco de privacidade — alguém poderia recuperar projetos que você deliberadamente excluiu. Além disso, manter cópias de segurança de todos os projetos excluídos consumiria uma quantidade enorme de armazenamento, o que elevaria os custos para todos os usuários.</p>
                                
                                <h3>Considerações antes de excluir</h3>
                                <p>Antes de excluir um projeto, considere o seguinte:</p>
                                <ul>
                                    <li>Você tem certeza de que não precisará mais deste projeto?</li>
                                    <li>Existem cópias de backup em algum lugar (computador local, outro serviço)?</li>
                                    <li>O projeto contém trabalho original ou único que seria impossível recriar?</li>
                                    <li>Você está excluindo por engano ou porque realmente não precisa mais?</li>
                                </ul>
                                
                                <h3>Alternativas à exclusão</h3>
                                <p>Se você não tem certeza sobre excluir, considere alternativas:</p>
                                <ul>
                                    <li><strong>Arquivar:</strong> Se o projeto não é mais usado mas você quer mantê-lo, considere apenas movê-lo para uma categoria de arquivado (se disponível)</li>
                                    <li><strong>Duplicar antes de excluir:</strong> Se quer fazer alterações drásticas, duplique o projeto primeiro e trabalhe na cópia</li>
                                    <li><strong>Exportar:</strong> Se possível, exporte o projeto ou seus arquivos para outro formato antes de excluir</li>
                                </ul>
                                
                                <h3>Backup antes de excluir</h3>
                                <p>Se o projeto contém trabalho importante, faça backup antes de excluir. Isso pode significar baixar os arquivos de áudio para o computador, exportar configurações do mixer, ou fazer uma cópia em outro serviço. Embora exija trabalho extra, o backup pode salvar você de perder trabalho irreversível.</p>
                                
                                <h3>Exclusão em massa</h3>
                                <p>Se você precisa excluir múltiplos projetos, verifique se o W.Tracks oferece exclusão em massa. Se não disponível, você precisará excluir cada projeto individualmente. Tome o mesmo cuidado com cada exclusão — a irreversibilidade se aplica a cada uma.</p>
                                
                                <h3>Após a exclusão</h3>
                                <p>Uma vez excluído, o projeto desaparece imediatamente da sua biblioteca. Se você estava logado em múltiplos dispositivos, o projeto também será removido deles na próxima sincronização. Não há forma de "desfazer" a exclusão através da interface — se cometeu um erro, a única opção seria contactar o suporte, mas mesmo assim não há garantia de recuperação.</p>
                            `
                        }
                    ]
                },

                            id: 'o-que-waveform',
                            title: 'O que é a waveform e para que serve?',
                            content: `
                                <p>A waveform (ou forma de onda) é a representação visual do áudio — é como o som "parece" quando desenhado como um gráfico. Ela mostra a intensidade do som ao longo do tempo, permitindo que você "veja" a música em vez de apenas ouvi-la. Essa representação visual é fundamental para profissionais de áudio e músicos, pois fornece informações instantâneas sobre a estrutura e o conteúdo do áudio.</p>
                                
                                <h3>O que a waveform mostra</h3>
                                <p>A waveform revela várias características importantes do áudio:</p>
                                <ul>
                                    <li><strong>Intensidade do som:</strong> A altura das ondas indica o volume — ondas altas representam sons fortes, ondas baixas representam sons suaves</li>
                                    <li><strong>Momentos de pico:</strong> Os pontos mais altos da waveform mostram onde estão os momentos de maior volume na música</li>
                                    <li><strong>Trechos silenciosos:</strong> Áreas quase planas indicam passagens calmas ou silêncio</li>
                                    <li><strong>Estrutura geral:</strong> Você pode identificar visualmente onde começa e termina cada seção — intro, verso, refrão, ponte, final</li>
                                    <li><strong>Dinâmica:</strong> A variação entre ondas altas e baixas mostra a dinâmica da música — se é constante ou varia muito</li>
                                </ul>
                                
                                <h3>Waveform única por projeto</h3>
                                <p>No W.Tracks, a waveform é única por projeto — ela representa todas as tracks juntas, não cada track individualmente. Isso significa que a waveform mostra a soma de todas as tracks combinadas, como se você estivesse ouvindo a mixagem completa. Essa abordagem é intencional: ela ajuda você a entender rapidamente onde cada parte da música está no contexto do arranjo completo, sem precisar tocar tudo para descobrir.</p>
                                
                                <h3>Por que waveform por projeto e não por track?</h3>
                                <p>Ter uma waveform combinada é mais útil para navegação e edição porque mostra a estrutura real da música como ela será ouvida. Se cada track tivesse sua própria waveform separada, você teria que mentaisomar todas elas para entender a estrutura completa — a waveform combinada já faz isso automaticamente. Para detalhes específicos de cada track, você ainda pode ouvi-las individualmente usando solo e mute.</p>
                                
                                <h3>Performance e carregamento</h3>
                                <p>A waveform é calculada uma vez quando você adiciona as músicas ao projeto e depois é reaproveitada. Isso significa que o projeto abre mais rápido nas vezes subsequentes, pois não precisa processar tudo novamente toda vez que você o abre. O sistema analisa os arquivos de áudio, gera a representação visual e a salva como parte do projeto. Esse processo de cálculo inicial pode levar alguns segundos em projetos grandes, mas o ganho de performance depois vale a pena.</p>
                                
                                <h3>Navegação pela waveform</h3>
                                <p>A waveform não é apenas decorativa — ela é interativa. Você pode clicar em qualquer ponto da waveform para pular diretamente para aquele momento da música. Isso é muito mais preciso do que tentar encontrar um trecho arrastando o progresso linearmente. Além disso, a waveform mostra marcadores visuais para loops, cortes e outros pontos de interesse que você possa ter definido.</p>
                                
                                <h3>Edição baseada em waveform</h3>
                                <p>Muitas operações de edição são baseadas na waveform. Quando você quer definir um loop, por exemplo, você seleciona visualmente o início e fim observando a waveform para identificar exatamente onde começa e termina o trecho desejado. A precisão visual que a waveform proporciona é especialmente valiosa para edições que exigem sincronização perfeita.</p>
                                
                                <h3>Limitações da waveform</h3>
                                <p>É importante entender que a waveform mostra amplitude (volume), mas não frequência (altura das notas). Você não pode ver se uma nota é dó ou mi apenas olhando a waveform — para isso você precisaria de análise espectral ou outras ferramentas. A waveform é excelente para estrutura e dinâmica, mas não substitui o ouvido para análise musical detalhada.</p>
                                
                                <h3>Waveform em diferentes contextos</h3>
                                <p>A waveform aparece em vários lugares do W.Tracks: na timeline principal do projeto, em visualizações de edição, e às vezes em interfaces de exportação. Em cada contexto, ela serve a propósitos ligeiramente diferentes, mas o princípio fundamental é o mesmo: representação visual do áudio para auxiliar navegação e edição.</p>
                            `
                        },
                        {
                            id: 'como-funciona-mixer',
                            title: 'Como funciona o mixer?',
                            content: `
                                <p>O mixer do W.Tracks funciona como um console de áudio profissional, permitindo controlar individualmente cada track da sua mixagem. É no mixer que você equilibra os volumes, posiciona os sons no espaço estéreo, decide quais instrumentos ouvir em cada momento, e aplica controles básicos que definem como cada track se comporta na mixagem final.</p>
                                
                                <h3>Estrutura do mixer</h3>
                                <p>O mixer é organizado em canais verticais, onde cada canal representa uma track do seu projeto. Da esquerda para a direita, você geralmente encontra os canais na ordem em que as tracks foram adicionadas ao projeto, embora você possa reorganizá-los conforme sua preferência. Cada canal contém controles específicos para aquela track, permitindo manipulação independente.</p>
                                
                                <h3>Faders (controles de volume)</h3>
                                <p>Os faders são os controles deslizantes verticais que regulam o volume de cada track. Puxar o fader para cima aumenta o volume daquela track, puxar para baixo diminui. A posição do fader é mostrada em decibéis (dB) — valores positivos aumentam o volume, valores negativos diminuem. O fader principal controla o volume de toda a mixagem combinada.</p>
                                
                                <p>Os faders permitem equilibrar os volumes relativos das tracks — você pode, por exemplo, aumentar o volume da voz principal em relação aos instrumentos de acompanhamento, ou diminuir o volume de uma track que está predominando demais. Esse equilíbrio é fundamental para uma mixagem agradável onde todos os elementos podem ser ouvidos claramente.</p>
                                
                                <h3>Mute (silenciamento)</h3>
                                <p>O botão Mute silencia completamente a track correspondente. Quando ativado, o som daquela track não é reproduzido, mas a track continua ativa no projeto — ela não é removida, apenas temporariamente silenciada. O Mute é diferente de diminuir o volume com o fader; com Mute, o som é completamente cortado, independentemente da posição do fader.</p>
                                
                                <p>O Mute é útil em várias situações: quando você quer ouvir como a música soa sem um determinado instrumento, quando está focando em editar uma track específica e quer ouvir só ela, ou quando precisa remover temporariamente um elemento que está causando problemas na mixagem. A track mutada permanece visível no mixer e pode ser reativada instantaneamente.</p>
                                
                                <h3>Solo (isolamento)</h3>
                                <p>O botão Solo isola apenas a track selecionada, silenciando automaticamente todas as outras tracks do projeto. Quando você ativa Solo em uma track, você ouve apenas aquela track, mesmo que outras estejam com faders levantados. Se ativar Solo em múltiplas tracks, você ouvirá apenas as tracks que estão em Solo, todas as outras ficarão silenciadas.</p>
                                
                                <p>O Solo é extremamente útil para análise detalhada e edição. Você pode isolar a bateria para ajustar os ritmos, isolar a voz para corrigir problemas de pitch, ou isolar um instrumento solo para trabalhar em detalhes específicos. O Solo permite focar em um elemento por vez sem a confusão auditiva de todos os outros instrumentos tocando simultaneamente.</p>
                                
                                <h3>Pan (posicionamento estéreo)</h3>
                                <p>O controle Pan determina a posição estéreo de cada track — você pode posicionar o som totalmente à esquerda, totalmente à direita, ou em qualquer ponto intermediário. O centro é a posição padrão, onde o som parece vir de ambos os lados igualmente. Pan é especialmente importante para criar paisagens sonoras imersivas e para separar instrumentos que ocupam frequências similares.</p>
                                
                                <p>Por exemplo, você pode posicionar as guitarras rítmicas levemente à esquerda e à direita para criar um estéreo mais largo, ou colocar a voz no centro enquanto os backing vocals ficam paneados para os lados. O Pan ajuda a criar profundidade e separação na mixagem, evitando que todos os instrumentos soem como se estivessem no mesmo lugar.</p>
                                
                                <h3>Interação entre controles</h3>
                                <p>Os controles do mixer interagem entre si. Por exemplo, se você usar Solo em uma track, o Mute das outras tracks é ativado automaticamente, mas suas posições de Pan e Fader são preservadas. Quando você desativa o Solo, tudo volta ao estado anterior. O sistema é projetado para preservar suas configurações enquanto usa funções temporárias como Solo e Mute.</p>
                                
                                <h3>Salvamento de configurações</h3>
                                <p>Todas as configurações do mixer — posições de faders, estados de Mute e Solo, posições de Pan — são salvas automaticamente com o projeto. Quando você fecha e reabre o projeto, o mixer exatamente como você deixou. Isso permite que você trabalhe em uma mixagem ao longo de múltiplas sessões sem perder o progresso.</p>
                                
                                <h3>Mixagem como processo criativo</h3>
                                <p>O mixer não é apenas técnico — é uma ferramenta criativa. A forma como você equilibra os volumes, posiciona os instrumentos e decide o que ouvir em cada momento afeta profundamente como a música é percebida. Uma boa mixagem pode transformar uma gravação comum em algo profissional e envolvente, enquanto uma mixagem ruim pode prejudicar até mesmo uma gravação excelente.</p>
                            `
                        },
                        {
                            id: 'loops-pads-efeitos',
                            title: 'Loops, pads e efeitos - o que cada um faz?',
                            content: `
                                <p>Loops, pads e efeitos são ferramentas poderosas que expandem as possibilidades criativas do W.Tracks. Enquanto o mixer controla os aspectos básicos de volume e posicionamento, essas ferramentas permitem manipular o áudio de formas mais avançadas e criativas, adicionando texturas, repetições e transformações sonoras que vão além do que é possível apenas com gravação estática.</p>
                                
                                <h3>Loops (repetição de trechos)</h3>
                                <p>Loops permitem repetir um trecho específico da música continuamente. Você define um ponto de início e um ponto de fim, e o W.Tracks repete esse trecho indefinidamente até você parar o loop. Os loops são ferramentas extremamente versáteis com múltiplos usos:</p>
                                
                                <ul>
                                    <li><strong>Prática:</strong> Músicos podem usar loops para praticar partes difíceis repetidamente até dominá-las</li>
                                    <li><strong>Arranjos:</strong> Produtores podem criar arranjos baseados em loops, repetindo padrões rítmicos ou melódicos</li>
                                    <li><strong>Performance ao vivo:</strong> Loops permitem criar bases musicais para improvisação ao vivo</li>
                                    <li><strong>Edição:</strong> Editores podem isolar problemas específicos repetindo trechos problemáticos</li>
                                </ul>
                                
                                <p>Os loops podem ser de qualquer tamanho — desde uma fração de segundo até vários minutos. Loops curtos criam efeitos rítmicos interessantes, enquanto loops longos podem estruturar seções inteiras de uma música. O W.Tracks permite sobrepor múltiplos loops, criar loops aninhados e sincronizar loops com o tempo da música.</p>
                                
                                <h3>Pads (triggers de som)</h3>
                                <p>Pads são superfícies sensíveis ao toque ou clicáveis que disparam sons ou efeitos instantaneamente quando ativados. Imagine um teclado onde cada tecla toca um som diferente — os pads funcionam de forma similar, mas são mais flexíveis e podem ser configurados para diversos propósitos:</p>
                                
                                <ul>
                                    <li><strong>Percussão:</strong> Pads podem tocar sons de bateria, percussão ou efeitos sonoros ritmados</li>
                                    <li><strong>Frases:</strong> Alguns pads podem disparar frases musicais completas ou acordes</li>
                                    <li><strong>Efeitos:</strong> Pads podem ativar efeitos instantâneos como risadas, aplausos ou sons ambiente</li>
                                    <li><strong>Controle:</strong> Pads podem servir como controles para iniciar ou parar loops, mudar seções ou disparar automações</li>
                                </ul>
                                
                                <p>Os pads são especialmente valiosos em performances ao vivo, onde o músico precisa adicionar elementos sonoros de forma espontânea e precisa. Ao contrário de pré-gravações fixas, os pads permitem interatividade — o músico decide quando e como cada som é adicionado à performance.</p>
                                
                                <h3>Efeitos (processamento de áudio)</h3>
                                <p>Efeitos processam o áudio para criar sonoridades diferentes. Eles podem transformar sons simples em texturas complexas, adicionar profundidade e espaço, ou corrigir problemas na gravação original. O W.Tracks oferece diversos efeitos com propósitos específicos:</p>
                                
                                <h4>Reverb (reverberação)</h4>
                                <p>O Reverb simula a reverberação natural de ambientes físicos — desde pequenos quartos até grandes catedrais. Quando você adiciona reverb a um som, ele passa a ter características acústicas do ambiente simulado, como caudas longas e reflexões. O Reverb é usado para:</p>
                                <ul>
                                    <li>Adicionar profundidade e espaço a sons secos</li>
                                    <li>Criar sensação de ambiente (por exemplo, fazer a voz soar como se estivesse em um estádio)</li>
                                    <li>Unir elementos da mixagem através de um "espaço acústico" comum</li>
                                    <li>Criar efeitos especiais como reverb inverso ou gates de reverb</li>
                                </ul>
                                
                                <h4>Delay (eco)</h4>
                                <p>O Delay cria ecos repetitivos do som original. O som é reproduzido, depois reproduzido novamente após um intervalo de tempo, e esse processo se repite criando um padrão de eco. O Delay pode ser:</p>
                                <ul>
                                    <li><strong>Curto:</strong> Cria ecos rápidos que se fundem com o som original, criando textura</li>
                                    <li><strong>Longo:</strong> Cria ecos distintos que se repetem várias vezes, criando padrões rítmicos</li>
                                    <li><strong>Sincronizado:</strong> O tempo do eco é sincronizado com o tempo da música para manter ritmo consistente</li>
                                    <li><strong>Feedback:</strong> Controla quantas vezes o eco se repete antes de desaparecer</li>
                                </ul>
                                
                                <h4>EQ (equalização)</h4>
                                <p>O EQ ajusta o equilíbrio de frequências do áudio — permite aumentar ou diminuir graves, médios e agudos independentemente. É uma das ferramentas mais importantes na mixagem porque permite:</p>
                                <ul>
                                    <li>Corrigir problemas na gravação (por exemplo, reduzir chiudo em agudos)</li>
                                    <li>Separar instrumentos que ocupam frequências similares (puxar graves do baixo, cortar graves da voz)</li>
                                    <li>Ajustar o tom geral (tornar mais brilhante ou mais escuro)</li>
                                    <li>Compensar características de microfones ou ambientes de gravação</li>
                                </ul>
                                
                                <h4>Compressor</h4>
                                <p>O Compressor controla a dinâmica do volume — ele reduz a diferença entre os sons mais fortes e mais fracos. Quando uma passagem fica muito alta, o compressor a reduz; quando fica muito baixa, ele pode aumentá-la. O Compressor serve para:</p>
                                <ul>
                                    <li>Evitar que sons fiquem distorcidos por ficarem muito altos</li>
                                    <li>Tornar performances mais consistentes em volume</li>
                                    <li>Fazer com que instrumentos fiquem mais presentes na mixagem</li>
                                    <li>Criar efeitos especiais como "pumping" rítmico</li>
                                </ul>
                                
                                <h3>Combinação de ferramentas</h3>
                                <p>Loops, pads e efeitos podem ser combinados de formas criativas. Por exemplo, você pode criar um loop de bateria, adicionar reverb para dar profundidade, e usar pads para disparar efeitos sincronizados em pontos específicos. A combinação dessas ferramentas é o que permite criar produções complexas e interessantes no W.Tracks.</p>
                                
                                <h3>Performance vs estúdio</h3>
                                <p>Essas ferramentas têm usos diferentes em contexto de estúdio versus performance ao vivo. Em estúdio, o foco é na precisão e na perfeição técnica — loops perfeitamente sincronizados, efeitos cuidadosamente ajustados. Ao vivo, o foco é na espontaneidade e na interatividade — pads disparados no momento certo, efeitos que respondem à energia da performance. O W.Tracks serve bem a ambos os contextos.</p>
                            `
                        }
                    ]
                },

                            title: 'Quais as diferenças entre os planos?',
                            content: `
                                <p>O W.Tracks oferece dois planos principais — Gratuito e Track Pro — cada um projetado para atender diferentes necessidades e níveis de uso. Entender as diferenças entre os planos ajuda você a escolher o que melhor se adapta ao seu fluxo de trabalho, ao seu orçamento e aos seus objetivos musicais.</p>
                                
                                <h3>Plano Gratuito</h3>

                                <p>Características do plano gratuito:</p>

                                    <li><strong>Setlists limitadas:</strong> Até 3 setlists. Setlists são coleções organizadas de projetos para apresentações ao vivo. Com 3 setlists, você pode ter algumas playlists preparadas, mas não um número ilimitado</li>

                                    <li><strong>Sem sincronização na nuvem:</strong> Este é o recurso mais significativo que falta no plano gratuito. Sem sincronização, seus projetos ficam salvos apenas localmente no dispositivo onde foram criados. Você não pode acessá-los de outros dispositivos automaticamente</li>
                                    <li><strong>Recursos básicos:</strong> Acesso ao mixer, edição básica, loops, pads e efeitos fundamentais</li>

                                <p>Características do plano Track Pro:</p>

                                <h3>Comparação direta</h3>

                                <h3>Quem deve usar cada plano?</h3>

                                <p>O sistema de login do W.Tracks é projetado com segurança como prioridade absoluta, usando autenticação robusta por e-mail e senha combinada com práticas modernas de proteção de identidade. O login não é apenas uma porta de entrada — é um sistema completo de segurança que protege sua conta, seus dados e sua privacidade em múltiplas camadas.</p>

                                <p>Esse sistema de acesso temporário permite que você continue usando o W.Tracks sem precisar digitar a senha toda vez, ao mesmo tempo em que mantém segurança — se alguém obtiver acesso ao seu dispositivo, não conseguirá usar suas credenciais em outros dispositivos, e o acesso expirará automaticamente após um período.</p>

                                <h3>Criptografia da conexão (trânsito)</h3>
                                <p>A conexão entre seu dispositivo e os servidores do W.Tracks é criptografada usando os mesmos padrões de segurança que bancos e serviços financeiros usam. É esse o famoso "cadeado" que você vê no navegador — ele indica que toda a comunicação está protegida.</p>
                                
                                <p>Essa criptografia de trânsito significa que:</p>
                                <ul>
                                    <li>Todos os dados enviados e recebidos são codificados durante a viagem pela internet</li>
                                    <li>Mesmo que alguém conseguisse interceptar a comunicação (por exemplo, em uma rede Wi-Fi pública), não conseguiria ler o conteúdo</li>
                                    <li>A criptografia é negociada automaticamente entre seu navegador e os servidores — você não precisa configurar nada</li>
                                    <li>Certificados digitais garantem que você está realmente se comunicando com os servidores do W.Tracks e não com um impostor</li>
                                </ul>
                                
                                <h3>Criptografia no armazenamento</h3>
                                <p>Depois que os arquivos chegam aos servidores do W.Tracks, eles continuam criptografados. O armazenamento em disco também é protegido:</p>
                                <ul>
                                    <li>Os arquivos são armazenados em formato criptografado nos servidores</li>
                                    <li>Apenas o sistema do W.Tracks tem acesso às chaves necessárias para descriptografar os arquivos quando necessário</li>
                                    <li>Mesmo alguém com acesso físico aos servidores não conseguiria ler o conteúdo dos arquivos sem as chaves apropriadas</li>
                                    <li>Backups e cópias de segurança também são criptografados usando as mesmas chaves</li>
                                </ul>
                                
                                <h3>Isolamento de contas (segregação de dados)</h3>
                                <p>Uma das proteções mais importantes é o isolamento completo entre contas de usuários. Cada usuário só tem acesso às próprias músicas e projetos:</p>
                                <ul>
                                    <li>Os dados de cada conta são segregados — não há banco de dados compartilhado onde alguém poderia ver projetos de outros usuários</li>
                                    <li>O sistema de autenticação garante que cada solicitação de acesso seja verificada contra a identidade do usuário</li>
                                    <li>Mesmo administradores do sistema não têm acesso aos arquivos de áudio dos usuários sem autorização explícita</li>
                                    <li>Projetos são vinculados matematicamente à conta do criador — não é possível "acidentalmente" acessar projetos de outra pessoa</li>
                                </ul>
                                
                                <p>Isso significa que ninguém mais consegue ver, baixar ou tocar as tracks de outra pessoa, mesmo estando logado no site. Cada conta é completamente isolada — seus projetos são visíveis apenas para você, e os projetos de outras pessoas são invisíveis para você.</p>
                                
                                <h3>Controle de acesso granular</h3>
                                <p>O sistema de controle de acesso é granular e específico. Quando você faz uma solicitação — por exemplo, abrir um projeto — o sistema verifica:</p>
                                <ul>
                                    <li>Quem está fazendo a solicitação (sua identidade)</li>
                                    <li>Se essa identidade tem permissão para acessar o recurso específico solicitado</li>
                                    <li>Se a solicitação está dentro de padrões normais de uso</li>
                                    <li>Se não há bloqueios ou restrições na conta</li>
                                </ul>
                                
                                <p>Essa verificação acontece para cada operação, não apenas no login. Mesmo que alguém obtivesse seu acesso temporário, não conseguiria acessar projetos de outros usuários porque o sistema verificaria que aquele acesso não tem permissão para aqueles recursos específicos.</p>
                                
                                <h3>Privacidade dos arquivos de áudio</h3>
                                <div class="info-box">
                                    <strong>Privacidade garantida:</strong> Seus arquivos de áudio são privados. Não compartilhamos suas músicas com outros usuários, elas não ficam visíveis em nenhum lugar público do site, e não são usados para treinamento de sistemas ou outros propósitos sem seu consentimento explícito.
                                </div>
                                
                                <p>Além da segurança técnica, há garantias de privacidade:</p>
                                <ul>
                                    <li>Seus arquivos não são indexados por mecanismos de busca públicos</li>
                                    <li>Não há galerias ou bibliotecas públicas onde outros usuários possam ver seus projetos</li>
                                    <li>O W.Tracks não vende ou compartilha seus dados com terceiros</li>
                                    <li>Você tem controle completo sobre quem pode acessar seus projetos (no futuro, recursos de compartilhamento permitirão convidar colaboradores específicos)</li>
                                </ul>
                                
                                <h3>Proteção contra acesso não autorizado</h3>
                                <p>O sistema implementa múltiplas proteções contra acesso não autorizado:</p>
                                <ul>
                                    <li><strong>Rate limiting:</strong> Limita o número de tentativas de acesso para evitar ataques de força bruta</li>
                                    <li><strong>Validação de entrada:</strong> Todas as entradas são validadas para evitar injeção de código ou outros ataques</li>
                                    <li><strong>Monitoramento:</strong> Atividades suspeitas são detectadas e podem bloquear acessos automaticamente</li>
                                    <li><strong>Revisão de segurança:</strong> O sistema é regularmente auditado por especialistas em segurança</li>
                                </ul>
                                
                                <h3>Backup e recuperação</h3>
                                <p>Seus arquivos são protegidos contra perda através de sistemas robustos de backup:</p>
                                <ul>
                                    <li>Backups automáticos são feitos regularmente em múltiplas localizações</li>
                                    <li>Os backups também são criptografados usando as mesmas chaves</li>
                                    <li>Em caso de falha de hardware, seus dados podem ser restaurados dos backups</li>
                                    <li>O sistema é projetado para alta disponibilidade — é improvável que você perca dados devido a falhas técnicas</li>
                                </ul>
                                
                                <h3>Seus direitos sobre seus dados</h3>
                                <p>Você mantém direitos completos sobre seus arquivos de áudio:</p>
                                <ul>
                                    <li>Você pode baixar seus arquivos a qualquer momento (recursos de exportação)</li>
                                    <li>Você pode excluir seus projetos e arquivos quando desejar</li>
                                    <li>Se você excluir sua conta, todos os seus dados são removidos dos servidores</li>
                                    <li>Você pode solicitar uma cópia dos seus dados para portabilidade</li>
                                </ul>
                                
                                <h3>Transparência sobre segurança</h3>
                                <p>O W.Tracks é transparente sobre suas práticas de segurança:</p>
                                <ul>
                                    <li>Políticas de privacidade claras explicam como seus dados são usados</li>
                                    <li>Notificações são enviadas sobre alterações significativas nas políticas</li>
                                    <li>Você pode entrar em contato com a equipe de segurança para dúvidas específicas</li>
                                    <li>Vulnerabilidades de segurança são tratadas com prioridade máxima</li>
                                </ul>
                                
                                <h3>Compartilhamento e colaboração (futuro)</h3>
                                <p>No futuro, o W.Tracks pode implementar recursos de compartilhamento e colaboração. Quando isso acontecer, a segurança permanecerá prioritária:</p>
                                <ul>
                                    <li>Compartilhamento será explícito — você terá que conviar pessoas específicas</li>
                                    <li>Você poderá definir níveis de permissão (visualização, edição, download)</li>
                                    <li>Poderá revogar acesso a qualquer momento</li>
                                    <li>Logs de atividade mostrarão quem acessou seus projetos e quando</li>
                                </ul>
                                
                                <p>Até que esses recursos estejam disponíveis, seus projetos permanecem completamente privados e acessíveis apenas para você.</p>
                            `
                        }
                    ]
                }
            ]
        };

        // ========================================
        // RENDERIZAÇÃO DA SIDEBAR
        // ========================================
        function renderSidebar() {
            const sidebar = document.getElementById('helpSidebar');
            sidebar.innerHTML = '';
            
            helpData.topics.forEach(topic => {
                const section = document.createElement('div');
                section.className = 'help-sidebar-section';
                
                const title = document.createElement('div');
                title.className = 'help-sidebar-title';
                title.innerHTML = `
                    ${topic.title}
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 9l6 6 6-6"/>
                    </svg>
                `;
                title.onclick = () => toggleTopic(topic.id);
                
                const questionsList = document.createElement('div');
                questionsList.className = 'help-sidebar-questions';
                questionsList.id = `questions-${topic.id}`;
                
                topic.questions.forEach(question => {
                    const questionLink = document.createElement('a');
                    questionLink.className = 'help-sidebar-question';
                    questionLink.textContent = question.title;
                    questionLink.onclick = () => showQuestion(question.id);
                    questionLink.dataset.questionId = question.id;
                    questionsList.appendChild(questionLink);
                });
                
                section.appendChild(title);
                section.appendChild(questionsList);
                sidebar.appendChild(section);
            });
        }

        // ========================================
        // RENDERIZAÇÃO DO CONTEÚDO
        // ========================================
        function renderContent() {
            const content = document.getElementById('helpContent');
            content.innerHTML = '';
            
            helpData.topics.forEach(topic => {
                topic.questions.forEach(question => {
                    const article = document.createElement('article');
                    article.className = 'help-article';
                    article.id = `article-${question.id}`;
                    
                    article.innerHTML = `
                        <div class="help-back-btn" onclick="showDefaultView()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 12H5M12 19l-7-7 7-7"/>
                            </svg>
                            Voltar
                        </div>
                        <h2 class="help-article-title">${question.title}</h2>
                        <div class="help-article-content">${question.content}</div>
                    `;
                    
                    content.appendChild(article);
                });
            });
            
            // Tela inicial
            const defaultView = document.createElement('div');
            defaultView.className = 'help-article active';
            defaultView.id = 'default-view';
            defaultView.innerHTML = `
                <h2 class="help-article-title">Bem-vindo à Central de Ajuda</h2>
                <div class="help-article-content">
                    <p>Selecione um tópico na barra lateral para encontrar respostas para suas dúvidas sobre o W.Tracks.</p>
                    <p>Você também pode usar a barra de busca acima para encontrar informações específicas rapidamente.</p>
                </div>
            `;
            content.appendChild(defaultView);
        }

        // ========================================
        // NAVEGAÇÃO
        // ========================================
        function toggleTopic(topicId) {
            const questionsList = document.getElementById(`questions-${topicId}`);
            const title = questionsList.previousElementSibling;
            
            questionsList.classList.toggle('expanded');
            title.classList.toggle('expanded');
        }

        function showQuestion(questionId) {
            // Remove active de todos
            document.querySelectorAll('.help-sidebar-question').forEach(q => q.classList.remove('active'));
            document.querySelectorAll('.help-article').forEach(a => a.classList.remove('active'));
            
            // Adiciona active ao selecionado
            const questionLink = document.querySelector(`[data-question-id="${questionId}"]`);
            if (questionLink) questionLink.classList.add('active');
            
            const article = document.getElementById(`article-${questionId}`);
            if (article) article.classList.add('active');
            
            // Fecha sidebar no mobile
            closeMobileSidebar();
        }

        function showDefaultView() {
            document.querySelectorAll('.help-sidebar-question').forEach(q => q.classList.remove('active'));
            document.querySelectorAll('.help-article').forEach(a => a.classList.remove('active'));
            
            const defaultView = document.getElementById('default-view');
            if (defaultView) defaultView.classList.add('active');
        }

        // ========================================
        // BUSCA
        // ========================================
        const searchInput = document.getElementById('helpSearchInput');
        const searchResults = document.getElementById('helpSearchResults');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            
            if (query.length < 2) {
                searchResults.classList.remove('active');
                return;
            }
            
            const results = [];
            
            helpData.topics.forEach(topic => {
                topic.questions.forEach(question => {
                    const titleMatch = question.title.toLowerCase().includes(query);
                    const contentMatch = question.content.toLowerCase().includes(query);
                    
                    if (titleMatch || contentMatch) {
                        // Criar excerpt do conteúdo
                        const plainContent = question.content.replace(/<[^>]*>/g, '');
                        let excerpt = plainContent;
                        
                        if (contentMatch) {
                            const index = plainContent.toLowerCase().indexOf(query);
                            if (index !== -1) {
                                const start = Math.max(0, index - 50);
                                const end = Math.min(plainContent.length, index + 100);
                                excerpt = '...' + plainContent.substring(start, end) + '...';
                            }
                        } else {
                            excerpt = plainContent.substring(0, 150) + '...';
                        }
                        
                        results.push({
                            id: question.id,
                            title: question.title,
                            topic: topic.title,
                            excerpt: excerpt
                        });
                    }
                });
            });
            
            if (results.length === 0) {
                searchResults.innerHTML = `
                    <div class="help-no-results">
                        <p>Nenhum resultado encontrado para "${query}"</p>
                        <p style="margin-top: 8px; font-size: 14px;">Tente outros termos ou entre em contato conosco.</p>
                    </div>
                `;
            } else {
                searchResults.innerHTML = results.map(result => `
                    <div class="help-search-result-item" onclick="showQuestion('${result.id}'); searchInput.value = ''; searchResults.classList.remove('active');">
                        <div class="help-result-title">${result.title}</div>
                        <div class="help-result-topic">${result.topic}</div>
                        <div class="help-result-excerpt">${result.excerpt}</div>
                    </div>
                `).join('');
            }
            
            searchResults.classList.add('active');
        });

        // Fechar busca ao clicar fora
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.classList.remove('active');
            }
        });

        // ========================================
        // MOBILE SIDEBAR
        // ========================================
        const mobileMenuToggle = document.getElementById('helpMobileMenuToggle');
        const sidebar = document.getElementById('helpSidebar');
        const sidebarOverlay = document.getElementById('helpSidebarOverlay');

        mobileMenuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('active');
        });

        sidebarOverlay.addEventListener('click', closeMobileSidebar);

        function closeMobileSidebar() {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
        }

        // ========================================
        // INICIALIZAÇÃO
        // ========================================
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            renderContent();
        });
    </script>
</body>
</html>
