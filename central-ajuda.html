                            title: 'Como adicionar músicas a uma setlist?',
                            content: `
                                <p>Adicionar músicas a uma setlist é o processo que transforma uma lista vazia em uma playlist completa pronta para apresentação. O W.Tracks oferece duas formas principais de adicionar músicas: através de busca no YouTube ou selecionando músicas da sua biblioteca pessoal. Cada método tem suas vantagens dependendo do seu fluxo de trabalho.</p>
                                
                                <h3>Método 1: Busca no YouTube</h3>
                                <p>A busca no YouTube é a forma mais comum de adicionar músicas, pois permite acessar praticamente qualquer música disponível na plataforma:</p>
                                <ul>
                                    <li>Abra a setlist que deseja editar clicando nela na lista de setlists</li>
                                    <li>No editor de setlists, localize o campo de busca — geralmente rotulado como "Buscar no YouTube"</li>
                                    <li>Digite o nome da música, artista ou termos de busca desejados</li>
                                    <li>O W.Tracks mostrará resultados da busca do YouTube correspondentes à sua pesquisa</li>
                                    <li>Cada resultado mostra o título da música, o canal, a capa e um botão de adicionar</li>
                                    <li>Clique no botão "+" ou "Adicionar" ao lado da música desejada</li>
                                    <li>A música será adicionada ao final da sua setlist automaticamente</li>
                                </ul>
                                
                                <h3>Como funciona a busca no YouTube?</h3>
                                <p>A busca no YouTube no W.Tracks usa a API do YouTube para encontrar vídeos musicais. Quando você digita termos de busca, o sistema consulta o YouTube e retorna resultados relevantes. Esses resultados incluem informações como título, canal, duração e thumbnail. O W.Tracks usa essas informações para criar um card de música na sua setlist sem precisar baixar o arquivo de áudio — a reprodução acontece diretamente através do player do YouTube.</p>
                                
                                <h3>Método 2: Biblioteca pessoal</h3>
                                <p>Se você já tem músicas salvas na sua biblioteca do W.Tracks, pode adicioná-las diretamente à setlist:</p>
                                <ul>
                                    <li>No editor de setlists, procure por uma opção "Adicionar da biblioteca" ou similar</li>
                                    <li>Isso abrirá uma interface mostrando suas músicas salvas</li>
                                    <li>Navegue pela sua biblioteca para encontrar a música desejada</li>
                                    <li>Clique na música para selecioná-la</li>
                                    <li>Confirme a adição — a música será adicionada à setlist</li>
                                </ul>
                                
                                <h3>Organização das músicas na setlist</h3>
                                <p>Quando você adiciona músicas, elas aparecem na ordem em que foram adicionadas. Para organizar a ordem:</p>
                                <ul>
                                    <li>No editor de setlists, cada música tem controles de reorganização</li>
                                    <li>Geralmente há botões de seta para cima/baixo ou ícones de arrastar</li>
                                    <li>Você pode mover músicas para cima ou para baixo na lista</li>
                                    <li>A ordem final é a ordem em que as músicas serão tocadas durante a apresentação</li>
                                </ul>
                                
                                <h3>Remover músicas da setlist</h3>
                                <p>Se adicionou uma música por engano ou quer alterar a setlist:</p>
                                <ul>
                                    <li>No editor de setlists, localize a música que deseja remover</li>
                                    <li>Clique no ícone de lixeira ou no botão "Remover" ao lado da música</li>
                                    <li>Confirme a remoção se solicitado</li>
                                    <li>A música será removida da setlist mas continuará disponível na biblioteca</li>
                                </ul>
                                
                                <h3>Duplicação em múltiplas setlists</h3>
                                <p>A mesma música pode estar em múltiplas setlists. Isso é útil quando você tem músicas que aparecem em vários contextos diferentes — por exemplo, uma música de louvor que é usada tanto em cultos dominicais quanto em eventos especiais. Adicionar a música a várias setlists não duplica o arquivo, apenas cria referências.</p>
                                
                                <h3>Informações exibidas nas músicas</h3>
                                <p>Na setlist, cada música mostra informações importantes:</p>
                                <ul>
                                    <li><strong>Thumbnail:</strong> A capa do vídeo do YouTube ou da música da biblioteca</li>
                                    <li><strong>Título:</strong> Nome da música</li>
                                    <li><strong>Canal/Artista:</strong> Quem fez a música</li>
                                    <li><strong>Duração:</strong> Tempo total da música</li>
                                    <li><strong>Número na lista:</strong> Posição da música na ordem da setlist</li>
                                </ul>
                                
                                <h3>Limites de músicas por setlist</h3>
                                <p>Não há limites rígidos no número de músicas por setlist, mas setlists muito longas podem ser difíceis de gerenciar. Para apresentações típicas, setlists de 10-20 músicas são comuns. Para álbuns completos ou shows muito longos, considere dividir em múltiplas setlists por seção (Parte 1, Parte 2, etc.).</p>
                            `
                        },
                        {
                            id: 'compartilhar-setlist',
                            title: 'Como compartilhar uma setlist?',
                            content: `
                                <p>O compartilhamento de setlists no W.Tracks permite que você envie sua playlist organizada para outras pessoas — membros da banda, colegas músicos, ou qualquer pessoa que precise ter acesso à mesma ordem de músicas. O compartilhamento cria um link público que qualquer pessoa pode acessar para ver e reproduzir sua setlist.</p>
                                
                                <h3>Por que compartilhar setlists?</h3>
                                <p>O compartilhamento é especialmente útil em vários cenários:</p>
                                <ul>
                                    <li><strong>Bandas:</strong> Todos os membros da banda podem ter acesso à mesma setlist, garantindo que todos saibam a ordem das músicas</li>
                                    <li><strong>Substitutos:</strong> Quando um músico substituto precisa saber o que tocar, pode acessar a setlist compartilhada</li>
                                    <li><strong>Organizadores de eventos:</strong> Podem ver antecipadamente a ordem das músicas que serão tocadas</li>
                                    <li><strong>Ensaios:</strong> Compartilhar a setlist com todos antes do ensaio para que todos possam se preparar</li>
                                    <li><strong>Backup:</strong> Ter uma versão compartilhada como backup da sua setlist principal</li>
                                </ul>
                                
                                <h3>Processo de compartilhamento</h3>
                                <p>Para compartilhar uma setlist, siga estes passos:</p>
                                <ul>
                                    <li>Abra a setlist que deseja compartilhar no editor de setlists</li>
                                    <li>Localize o botão de compartilhamento — geralmente representado por um ícone de link ou "Compartilhar"</li>
                                    <li>Clique no botão de compartilhamento</li>
                                    <li>O W.Tracks gerará um link único para aquela setlist específica</li>
                                    <li>O link será copiado automaticamente para sua área de transferência</li>
                                    <li>Você pode então colar o link em qualquer lugar — e-mail, WhatsApp, mensagem, etc.</li>
                                </ul>
                                
                                <h3>Como funciona o link de compartilhamento?</h3>
                                <p>O link gerado contém um identificador único (share ID) que aponta para sua setlist específica. Quando alguém clica nesse link:</p>
                                <ul>
                                    <li>O navegador abre uma página especial do W.Tracks para visualização de setlists públicas</li>
                                    <li>O sistema busca a setlist correspondente ao ID no link</li>
                                    <li>A setlist é exibida com todas as músicas na ordem correta</li>
                                    <li>A pessoa pode ver as músicas e reproduzi-las diretamente da página compartilhada</li>
                                </ul>
                                
                                <h3>O que as pessoas podem fazer com a setlist compartilhada?</h3>
                                <p>Quando você compartilha uma setlist, as pessoas que acessam o link podem:</p>
                                <ul>
                                    <li><strong>Visualizar:</strong> Ver todas as músicas na ordem que você definiu</li>
                                    <li><strong>Reproduzir:</strong> Tocar as músicas diretamente através do player integrado</li>
                                    <li><strong>Navegar:</strong> Pular entre músicas diferentes na setlist</li>
                                    <li><strong>Ver informações:</strong> Acessar títulos, canais e durações das músicas</li>
                                </ul>
                                
                                <p>No entanto, elas <strong>não podem</strong>:</p>
                                <ul>
                                    <li>Editar a setlist original</li>
                                    <li>Adicionar ou remover músicas</li>
                                    <li>Alterar a ordem das músicas</li>
                                    <li>Acessar outras setlists da sua conta</li>
                                </ul>
                                
                                <h3>Privacidade do compartilhamento</h3>
                                <p>É importante entender as implicações de privacidade:</p>
                                <ul>
                                    <li>Setlists compartilhadas ficam publicamente acessíveis através do link</li>
                                    <li>Qualquer pessoa com o link pode acessar a setlist</li>
                                    <li>Se você compartilhar o link em um lugar público (redes sociais, fórum), qualquer pessoa poderá clicar</li>
                                    <li>Considere isso antes de compartilhar setlists com conteúdo sensível</li>
                                </ul>
                                
                                <h3>Revogar compartilhamento</h3>
                                <p>Se você quiser parar de compartilhar uma setlist:</p>
                                <ul>
                                    <li>No momento, o W.Tracks não tem uma função explícita de "revogar compartilhamento"</li>
                                    <li>Se precisar remover o acesso, considere excluir a setlist e criar uma nova</li>
                                    <li>Links antigos deixarão de funcionar se a setlist for excluída</li>
                                </ul>
                                
                                <h3>Links permanentes vs temporários</h3>
                                <p>Os links de compartilhamento são permanentes enquanto a setlist existir. Isso significa:</p>
                                <ul>
                                    <li>O mesmo link continuará funcionando indefinidamente</li>
                                    <li>Se você atualizar a setlist (adicionar/remover músicas), as mudanças serão refletidas no link</li>
                                    <li>Não é necessário gerar novos links quando faz alterações</li>
                                    <li>Isso é útil para bandas que mantêm a mesma setlist e faz atualizações periódicas</li>
                                </ul>
                                
                                <h3>Compartilhamento em contextos diferentes</h3>
                                <p>Use o compartilhamento de forma estratégica:</p>
                                <ul>
                                    <li><strong>WhatsApp:</strong> Compartilhe com membros da banda para acesso rápido no celular</li>
                                    <li><strong>E-mail:</strong> Envie para organizadores de eventos como confirmação da programação</li>
                                    <li><strong>Redes sociais:</strong> Compartilhe com fãs para que eles saibam o que será tocado</li>
                                    <li><strong>Sites:</strong> Incorpore o link em sites de bandas ou páginas de eventos</li>
                                </ul>
                            `
                        },

                            id: 'usar-setlist-ao-vivo',
                            title: 'Como usar setlists em apresentações ao vivo?',
                            content: `
                                <p>Usar setlists em apresentações ao vivo é onde toda a organização prévia se transforma em performance prática. O W.Tracks é projetado especificamente para ajudar músicos durante shows, cultos e apresentações, fornecendo ferramentas que facilitam a navegação entre músicas e garantem transições suaves.</p>
                                
                                <h3>Preparação antes da apresentação</h3>
                                <p>O sucesso ao usar setlists ao vivo começa com boa preparação:</p>
                                <ul>
                                    <li><strong>Verifique a setlist:</strong> Abra a setlist e confirme que todas as músicas estão na ordem correta</li>
                                    <li><strong>Teste as músicas:</strong> Reproduza cada música brevemente para garantir que todas funcionam</li>
                                    <li><strong>Carregamento prévio:</strong> O W.Tracks carrega automaticamente as próximas músicas em segundo plano</li>
                                    <li><strong>Backup:</strong> Tenha uma cópia da setlist acessível em caso de problemas técnicos</li>
                                    <li><strong>Dispositivo:</strong> Use um dispositivo confiável com bateria carregada ou conectado à energia</li>
                                </ul>
                                
                                <h3>Interface durante apresentação</h3>
                                <p>Quando você está usando uma setlist ao vivo, a interface é otimizada para performance:</p>
                                <ul>
                                    <li><strong>Visualização clara:</strong> Cada música é exibida como um card grande e fácil de ler</li>
                                    <li><strong>Número da música:</strong> Cada música mostra sua posição na setlist (01, 02, 03, etc.)</li>
                                    <li><strong>Botões grandes:</strong> Controles de reprodução são grandes para fácil uso em palco</li>
                                    <li><strong>Informações essenciais:</strong> Título e artista são destacados, outras informações ficam em segundo plano</li>
                                    <li><strong>Indicador de música atual:</strong> A música que está tocando fica claramente destacada</li>
                                </ul>
                                
                                <h3>Navegação entre músicas</h3>
                                <p>Durante a apresentação, você precisa navegar entre as músicas de forma eficiente:</p>
                                <ul>
                                    <li><strong>Próxima música:</strong> Use o botão "Próxima" ou seta para avançar para a próxima música na setlist</li>
                                    <li><strong>Música anterior:</strong> Se precisar voltar, use o botão "Anterior" ou seta para trás</li>
                                    <li><strong>Pular direto:</strong> Clique em qualquer música da lista para pular diretamente para ela</li>
                                    <li><strong>Busca rápida:</strong> Em setlists muito longas, pode haver uma função de busca para encontrar músicas específicas</li>
                                </ul>
                                
                                <h3>Carregamento em segundo plano</h3>
                                <p>Uma das funcionalidades mais importantes para apresentações ao vivo é o carregamento em segundo plano:</p>
                                <ul>
                                    <li>Enquanto uma música está tocando, o W.Tracks carrega automaticamente a próxima música</li>
                                    <li>Isso significa que quando você clica em "Próxima", a música começa instantaneamente</li>
                                    <li>Não há tempo de carregamento entre músicas — essencial para transições suaves</li>
                                    <li>O sistema preenche o buffer de áudio antecipadamente para evitar interrupções</li>
                                </ul>
                                
                                <h3>Transições suaves</h3>
                                <p>Transições entre músicas são críticas em apresentações ao vivo:</p>
                                <ul>
                                    <li><strong>Sem gaps:</strong> O carregamento prévio elimina gaps silenciosos entre músicas</li>
                                    <li><strong>Volume consistente:</strong> O sistema mantém níveis de volume consistentes entre músicas</li>
                                    <li><strong>Play automático:</strong> Em alguns casos, você pode configurar reprodução automática da próxima música</li>
                                    <li><strong>Fade in/out:</strong> Dependendo das configurações, pode haver transições suaves de volume</li>
                                </ul>
                                
                                <h3>Gerenciamento de erros ao vivo</h3>
                                <p>Mesmo com boa preparação, erros podem acontecer durante apresentações:</p>
                                <ul>
                                    <li><strong>Música não carrega:</strong> Pule para a próxima música imediatamente e continue o show</li>
                                    <li><strong>Problema de conexão:</strong> Tenha músicas críticas baixadas localmente se possível</li>
                                    <li><strong>Ordem errada:</strong> Se pulou uma música, volte usando "Anterior" ou pule diretamente</li>
                                    <li><strong>Equipamento falha:</strong> Tenha um dispositivo backup com a mesma setlist carregada</li>
                                </ul>
                                
                                <h3>Integração com equipamento real</h3>
                                <p>Para usar setlists ao vivo profissionalmente:</p>
                                <ul>
                                    <li><strong>Áudio:</strong> Conecte a saída de áudio do dispositivo ao sistema de PA</li>
                                    <li><strong>Monitor:</strong> Use fones de ouvido ou monitores de palco para ouvir claramente</li>
                                    <li><strong>Controle remoto:</strong> Em alguns casos, use pedais ou controladores MIDI para navegação sem usar as mãos</li>
                                    <li><strong>Visibilidade:</strong> Coloque o dispositivo em um suporte onde fique visível durante o show</li>
                                </ul>
                                
                                <h3>Diferentes tipos de apresentações</h3>
                                <p>O uso de setlists varia dependendo do tipo de apresentação:</p>
                                <ul>
                                    <li><strong>Cultos religiosos:</strong> Setlists podem incluir momentos de louvor, adoração e mensagens</li>
                                    <li><strong>Shows de banda:</strong> Setlists seguem a estrutura típica de show com momentos altos e baixos</li>
                                    <li><strong>Eventos corporativos:</strong> Setlists podem ser mais conservadoras e previsíveis</li>
                                    <li><strong>Festivais:</strong> Setlists precisam ser muito precisas devido ao tempo limitado</li>
                                </ul>
                                
                                <h3>Após a apresentação</h3>
                                <p>Depois do show, aproveite para aprender e melhorar:</p>
                                <ul>
                                    <li><strong>Avalie a setlist:</strong> A ordem funcionou bem? Algumas músicas deveriam ser movidas?</li>
                                    <li><strong>Atualize se necessário:</strong> Faça ajustes na setlist baseado na experiência</li>
                                    <li><strong>Salve como template:</strong> Se a setlist foi especialmente boa, considere usá-la como base para futuros shows</li>
                                    <li><strong>Compartilhe feedback:</strong> Se trabalhou com outros músicos, discuta o que funcionou e o que pode ser melhorado</li>
                                </ul>
                            `

                            id: 'excluir-setlist',
                            title: 'Como excluir uma setlist?',
                            content: `
                                <div class="warning-box">
                                    <strong>Atenção:</strong> A exclusão de uma setlist é permanente. Uma vez excluída, não é possível recuperá-la através da interface. Certifique-se de realmente querer excluir antes de confirmar.
                                </div>
                                
                                <p>Excluir uma setlist remove-a permanentemente da sua conta e do sistema. Isso é diferente de arquivar ou esconder — a exclusão é definitiva. Por isso, é importante entender completamente o que acontece antes de prosseguir, especialmente se a setlist foi compartilhada com outras pessoas.</p>
                                
                                <h3>Processo de exclusão</h3>
                                <p>Para excluir uma setlist, siga estes passos:</p>
                                <ul>
                                    <li>Na área de setlists, encontre a setlist que deseja excluir</li>
                                    <li>Passe o mouse sobre o card da setlist para revelar os botões de ação</li>
                                    <li>Clique no menu de opções (geralmente representado por três pontos ou ícone de menu)</li>
                                    <li>Selecione a opção "Excluir" ou "Deletar" no menu que aparecer</li>
                                    <li>O sistema mostrará uma mensagem de confirmação avisando que a ação é permanente</li>
                                    <li>Leia atentamente a mensagem de confirmação e clique em "Confirmar" se tiver certeza</li>
                                    <li>A setlist será removida imediatamente da sua conta</li>
                                </ul>
                                
                                <h3>O que é excluído exatamente?</h3>
                                <p>Quando você exclui uma setlist, tudo relacionado a ela é removido:</p>
                                <ul>
                                    <li>A setlist em si desaparece da sua lista de setlists</li>
                                    <li>Todas as músicas associadas à setlist são removidas da lista</li>
                                    <li>A ordem das músicas é perdida</li>
                                    <li>O link de compartilhamento (se existir) deixa de funcionar</li>
                                    <li>Configurações específicas da setlist são eliminadas</li>
                                </ul>
                                
                                <h3>O que NÃO é excluído?</h3>
                                <p>É importante entender que a exclusão da setlist não afeta:</p>
                                <ul>
                                    <li><strong>Músicas da biblioteca:</strong> As músicas que estavam na setlist continuam disponíveis na sua biblioteca pessoal</li>
                                    <li><strong>Vídeos do YouTube:</strong> Os vídeos do YouTube associados não são afetados — eles continuam existindo no YouTube</li>
                                    <li><strong>Outras setlists:</strong> Setlists diferentes não são afetadas pela exclusão de uma</li>
                                    <li><strong>Seus projetos:</strong> Projetos multitrack que você criou permanecem intactos</li>
                                </ul>
                                
                                <h3>Impacto no compartilhamento</h3>
                                <p>Se você compartilhou a setlist com outras pessoas:</p>
                                <ul>
                                    <li>O link de compartilhamento deixa de funcionar imediatamente</li>
                                    <li>Pessoas que tentarem acessar o link receberão uma mensagem de "setlist não encontrada"</li>
                                    <li>Não há aviso prévio às pessoas que têm o link — o acesso simplesmente cessa</li>
                                    <li>Se você precisa remover o acesso mas manter a setlist, considere criar uma nova setlist e compartilhar o novo link</li>
                                </ul>
                                
                                <h3>Por que a exclusão é permanente?</h3>
                                <p>A exclusão permanente é uma medida de segurança e privacidade:</p>
                                <ul>
                                    <li>Protege sua privacidade — setlists antigas não ficam disponíveis indefinidamente</li>
                                    <li>Evita acúmulo de dados desnecessários no sistema</li>
                                    <li>Segue boas práticas de gerenciamento de dados — dados não utilizados devem ser removidos</li>
                                    <li>Garante que links antigos não continuem funcionando após você decidir remover o conteúdo</li>
                                </ul>
                                
                                <h3>Considerações antes de excluir</h3>
                                <p>Antes de excluir uma setlist, considere o seguinte:</p>
                                <ul>
                                    <li>Você tem certeza de que não precisará mais desta setlist específica?</li>
                                    <li>Outras pessoas dependem desta setlist (banda, organizadores de eventos)?</li>
                                    <li>Existem cópias de backup da ordem das músicas ou informações importantes?</li>
                                    <li>Você está excluindo por engano ou porque realmente não precisa mais?</li>
                                </ul>
                                
                                <h3>Alternativas à exclusão</h3>
                                <p>Se você não tem certeza sobre excluir, considere alternativas:</p>
                                <ul>
                                    <li><strong>Renomear:</strong> Se a setlist não está mais em uso mas quer manter, renomeie adicionando "Arquivado" ou similar</li>
                                    <li><strong>Duplicar antes de modificar:</strong> Se quer fazer alterações drásticas, duplique a setlist primeiro e trabalhe na cópia</li>
                                    <li><strong>Manter como referência:</strong> Setlists antigas podem servir como referência para futuras apresentações</li>
                                </ul>
                                
                                <h3>Exclusão em massa</h3>
                                <p>Se você precisa excluir múltiplas setlists:</p>
                                <ul>
                                    <li>Atualmente, o W.Tracks não oferece exclusão em massa</li>
                                    <li>Você precisa excluir cada setlist individualmente</li>
                                    <li>Tome o mesmo cuidado com cada exclusão — a irreversibilidade se aplica a cada uma</li>
                                    <li>Se tem muitas setlists para excluir, considere fazer isso em sessões separadas para evitar erros</li>
                                </ul>
                                
                                <h3>Após a exclusão</h3>
                                <p>Uma vez excluída, a setlist desaparece imediatamente da sua lista. Não há função "desfazer" para excluir setlists. Se cometeu um erro, a única opção seria recriar a setlist manualmente, adicionando as músicas novamente na ordem correta.</p>
                            `
                        }
                    ]

                            title: 'Quais as diferenças entre os planos?',
                            content: `
                                <p>O W.Tracks oferece dois planos principais — Gratuito e Track Pro — cada um projetado para atender diferentes necessidades e níveis de uso. Entender as diferenças entre os planos ajuda você a escolher o que melhor se adapta ao seu fluxo de trabalho, ao seu orçamento e aos seus objetivos musicais.</p>
                                
                                <h3>Plano Gratuito</h3>
                                <p>O plano gratuito é projetado para usuários casuais, experimentação e uso básico. Ele oferece acesso às funcionalidades principais do W.Tracks sem custo financeiro, permitindo que você explore a plataforma e determine se ela atende às suas necessidades antes de considerar um plano pago.</p>
                                
                                <p>Características do plano gratuito:</p>
                                <ul>
                                    <li><strong>Limitação de faders:</strong> Até 8 faders no mixer. Isso significa que você pode ter até 8 tracks em um projeto simultaneamente. Para muitos usuários, isso é suficiente para arranjos básicos, mas projetos complexos podem exigir mais</li>
                                    <li><strong>Setlists limitadas:</strong> Até 3 setlists. Setlists são coleções organizadas de projetos para apresentações ao vivo. Com 3 setlists, você pode ter algumas playlists preparadas, mas não um número ilimitado</li>

                                    <li><strong>Recursos básicos:</strong> Acesso ao mixer, edição básica, loops, pads e efeitos fundamentais</li>
                                    <li><strong>Suporte padrão:</strong> Acesso a suporte por e-mail com tempos de resposta padrão</li>
                                </ul>
                                
                                <h3>Plano Track Pro</h3>
                                <p>O plano Track Pro é projetado para usuários sérios, profissionais e qualquer pessoa que precise dos recursos mais avançados do W.Tracks. Ele remove as limitações do plano gratuito e adiciona funcionalidades poderosas que transformam a plataforma em uma ferramenta profissional completa.</p>
                                
                                <p>Características do plano Track Pro:</p>
                                <ul>
                                    <li><strong>Faders ilimitados:</strong> Sem limite no número de faders no mixer. Você pode criar projetos com dezenas ou até centenas de tracks, permitindo arranjos extremamente complexos e detalhados</li>

                                    <li><strong>Duração ilimitada por projeto:</strong> Sem restrições na duração dos arquivos. Você pode trabalhar com músicas longas, álbuns completos ou projetos de duração estendida sem preocupações</li>
                                    <li><strong>Sincronização automática na nuvem:</strong> Este é o recurso mais valioso do Track Pro. Seus projetos ficam salvos na nuvem e acessíveis de qualquer dispositivo. Comece no computador, continue no celular, finalize no tablet — tudo sincronizado automaticamente</li>
                                    <li><strong>Recursos avançados:</strong> Acesso a efeitos premium, ferramentas de edição avançadas, recursos de colaboração (quando disponíveis) e funcionalidades experimentais antes dos usuários gratuitos</li>
                                    <li><strong>Suporte prioritário:</strong> Tempos de resposta mais rápidos, suporte por chat quando disponível, e prioridade na resolução de problemas</li>
                                    <li><strong>Armazenamento aumentado:</strong> Mais espaço para armazenar seus projetos e arquivos na nuvem</li>
                                    <li><strong>Exportação avançada:</strong> Opções adicionais de exportação em diferentes formatos e qualidades</li>
                                </ul>
                                
                                <h3>Comparação direta</h3>
                                <p>Para visualizar as diferenças principais:</p>
                                <ul>
                                    <li><strong>Acesso multi-dispositivo:</strong> Gratuito (não disponível) vs Track Pro (disponível)</li>
                                    <li><strong>Complexidade de projetos:</strong> Gratuito (até 8 tracks) vs Track Pro (ilimitado)</li>
                                    <li><strong>Organização ao vivo:</strong> Gratuito (até 3 setlists) vs Track Pro (ilimitado)</li>
                                    <li><strong>Duração de projetos:</strong> Gratuito (limitada) vs Track Pro (ilimitada)</li>
                                    <li><strong>Nível de suporte:</strong> Gratuito (padrão) vs Track Pro (prioritário)</li>
                                </ul>
                                
                                <h3>Quem deve usar cada plano?</h3>
                                <p><strong>Plano Gratuito é ideal para:</strong></p>
                                <ul>
                                    <li>Usuários que estão experimentando o W.Tracks pela primeira vez</li>
                                    <li>Músicos casuais que não precisam de recursos avançados</li>
                                    <li>Quem usa apenas um dispositivo e não precisa de sincronização</li>
                                    <li>Estudantes ou iniciantes que estão aprendendo mixagem básica</li>
                                    <li>Projetos simples com poucas tracks</li>
                                </ul>
                                
                                <p><strong>Track Pro é ideal para:</strong></p>
                                <ul>
                                    <li>Músicos profissionais que dependem do W.Tracks para trabalho</li>
                                    <li>Usuários que trabalham em múltiplos dispositivos regularmente</li>
                                    <li>Projetos complexos com muitas tracks e arranjos elaborados</li>
                                    <li>Músicos ao vivo que precisam de setlists variadas e organizadas</li>
                                    <li>Quem precisa acessar projetos de qualquer lugar, a qualquer momento</li>

                                <h3>Upgrade e downgrade</h3>
                                <p>Você pode mudar entre planos a qualquer momento. Se começar no gratuito e decidir que precisa dos recursos do Pro, pode fazer upgrade instantaneamente. Se fizer upgrade e depois decidir que não precisa mais, pode fazer downgrade — seus projetos e dados são preservados, apenas os recursos ficam limitados novamente.</p>
                                
                                <h3>Planos empresariais</h3>
                                <p>Para equipes, estúdios ou organizações que precisam de múltiplas contas com gerenciamento centralizado, o W.Tracks pode oferecer planos empresariais personalizados. Esses planos incluem recursos como gestão de usuários, faturamento consolidado, contratos de nível de serviço (SLAs) e suporte dedicado. Entre em contato com a equipe comercial para discutir opções empresariais.</p>
                                
                                <h3>Períodos experimentais</h3>
                                <p>O W.Tracks pode oferecer períodos experimentais gratuitos do Track Pro, permitindo que você teste os recursos premium antes de se comprometer com uma assinatura. Aproveite esses períodos para explorar a sincronização na nuvem, testar projetos com muitas tracks e experimentar os recursos avançados para determinar se valem o investimento.</p>
                            `

                                <p>A exportação de projetos no W.Tracks permite que você salve seu trabalho em formatos que podem ser usados fora da plataforma. Isso é essencial para backup, para compartilhar com outras pessoas, ou para usar em outros softwares de áudio. A exportação transforma seu projeto multitrack em arquivos que podem ser reproduzidos, editados ou compartilhados independentemente do W.Tracks.</p>
                                
                                <h3>Por que exportar projetos?</h3>
                                <p>A exportação serve vários propósitos importantes:</p>
                                <ul>
                                    <li><strong>Backup:</strong> Manter cópias dos seus projetos em locais seguros fora da nuvem</li>
                                    <li><strong>Compartilhamento:</strong> Enviar projetos para colaboradores, produtores ou outros músicos</li>
                                    <li><strong>Uso em outros softwares:</strong> Continuar trabalhando em DAWs como Ableton, FL Studio, Pro Tools</li>
                                    <li><strong>Arquivamento:</strong> Salvar versões finais de músicas para referência futura</li>
                                    <li><strong>Publicação:</strong> Preparar arquivos para upload em plataformas de streaming</li>
                                    <li><strong>Independência:</strong> Ter acesso aos seus arquivos mesmo sem conexão com o W.Tracks</li>
                                </ul>
                                
                                <h3>Processo de exportação</h3>
                                <p>Para exportar um projeto, siga estes passos:</p>
                                <ul>
                                    <li>Abra o projeto que deseja exportar no editor do W.Tracks</li>
                                    <li>Localize o botão de exportação — geralmente representado por um ícone de download ou "Exportar"</li>
                                    <li>Clique no botão de exportação para abrir as opções de exportação</li>
                                    <li>Escolha o formato desejado para exportação (MP3, WAV, stems individuais, etc.)</li>
                                    <li>Selecione a qualidade/configurações desejadas (bitrate, sample rate, etc.)</li>
                                    <li>Escolha o local onde deseja salvar o arquivo no seu dispositivo</li>
                                    <li>Confirme a exportação e aguarde enquanto o arquivo é gerado</li>
                                    <li>O arquivo será salvo no local escolhido e estará pronto para uso</li>
                                </ul>
                                
                                <h3>Formatos de exportação disponíveis</h3>
                                <p>O W.Tracks oferece diferentes formatos conforme seu plano:</p>
                                <ul>
                                    <li><strong>MP3:</strong> Formato comprimido, ideal para compartilhamento e streaming</li>
                                    <li><strong>WAV:</strong> Formato sem perda, ideal para edição profissional e arquivamento</li>
                                    <li><strong>Stems individuais:</strong> Cada track como arquivo separado para mixagem em outros softwares</li>
                                    <li><strong>Stems comprimidos:</strong> ZIP contendo todos os stems individuais</li>
                                    <li><strong>Mixdown estéreo:</strong> Versão final mixada do projeto em arquivo único</li>
                                </ul>
                                
                                <h3>Exportação MP3</h3>
                                <p>O MP3 é o formato mais comum para uso geral:</p>
                                <ul>
                                    <li><strong>Vantagens:</strong> Arquivos pequenos, compatível com几乎所有 dispositivos, ideal para compartilhamento</li>
                                    <li><strong>Desvantagens:</strong> Compressão com perda de qualidade, não ideal para edição posterior</li>
                                    <li><strong>Bitrate:</strong> Escolha entre 128kbps (menor qualidade, arquivo menor) e 320kbps (maior qualidade, arquivo maior)</li>
                                    <li><strong>Uso recomendado:</strong> Compartilhamento, streaming, prévias, uso em dispositivos móveis</li>
                                </ul>
                                
                                <h3>Exportação WAV</h3>
                                <p>O WAV é o formato profissional por excelência:</p>
                                <ul>
                                    <li><strong>Vantagens:</strong> Sem perda de qualidade, ideal para edição profissional, padrão da indústria</li>
                                    <li><strong>Desvantagens:</strong> Arquivos muito grandes, não ideal para compartilhamento casual</li>
                                    <li><strong>Sample rate:</strong> Geralmente 44.1kHz ou 48kHz — escolha conforme seu uso pretendido</li>
                                    <li><strong>Bit depth:</strong> 16-bit ou 24-bit — 24-bit oferece mais dinâmica mas arquivos maiores</li>
                                    <li><strong>Uso recomendado:</strong> Edição profissional, masterização, arquivamento de alta qualidade</li>
                                </ul>
                                
                                <h3>Exportação de stems individuais</h3>
                                <p>Exportar stems é útil para mixagem em outros softwares:</p>
                                <ul>
                                    <li>Cada track do seu projeto é exportada como um arquivo separado</li>
                                    <li>Os arquivos mantêm os nomes que você deu às tracks no mixer</li>
                                    <li>Geralmente exportados em WAV para máxima qualidade</li>
                                    <li>Pode incluir ou não a masterização — geralmente stems são sem masterização</li>
                                    <li>Ideal para enviar para engenheiros de mixagem ou masterização</li>
                                </ul>
                                
                                <h3>Configurações de qualidade</h3>
                                <p>Para controlar a qualidade da exportação:</p>
                                <ul>
                                    <li><strong>Bitrate (MP3):</strong> 128kbps a 320kbps — maior valor = melhor qualidade</li>
                                    <li><strong>Sample rate:</strong> 44.1kHz (padrão CD) ou 48kHz (padrão vídeo)</li>
                                    <li><strong>Bit depth:</strong> 16-bit (padrão CD) ou 24-bit (maior resolução)</li>
                                    <li><strong>Canais:</strong> Estéreo (2 canais) ou mono (1 canal) — use estéreo para música</li>
                                </ul>
                                
                                <h3>Limitações de exportação por plano</h3>
                                <p>As opções de exportação variam conforme seu plano:</p>
                                <ul>
                                    <li><strong>Plano Gratuito:</strong> Exportação básica em MP3 com qualidade limitada</li>
                                    <li><strong>Plano Track Pro:</strong> Exportação completa em todos os formatos, incluindo WAV e stems</li>
                                    <li><strong>Resolução:</strong> Track Pro permite sample rates e bit depths mais altos</li>
                                </ul>
                                
                                <h3>Tempo de exportação</h3>
                                <p>O tempo necessário para exportar depende de:</p>
                                <ul>
                                    <li><strong>Tamanho do projeto:</strong> Projetos com muitas tracks levam mais tempo</li>
                                    <li><strong>Duração:</strong> Músicas mais longas demoram mais para processar</li>
                                    <li><strong>Formato:</strong> WAV de alta qualidade demora mais que MP3 comprimido</li>
                                    <li><strong>Processamento:</strong> Se o projeto tem efeitos complexos, leva mais tempo para renderizar</li>
                                    <li><strong>Dispositivo:</strong> Computadores mais rápidos exportam mais rapidamente</li>
                                </ul>
                                
                                <h3>Após a exportação</h3>
                                <p>Quando a exportação for concluída:</p>
                                <ul>
                                    <li>Verifique se o arquivo foi salvo no local correto</li>
                                    <li>Teste o arquivo em um player de áudio para confirmar que está completo</li>
                                    <li>Verifique a qualidade do áudio — não há cortes ou problemas</li>
                                    <li>Organize os arquivos exportados em uma estrutura lógica</li>
                                    <li>Considere fazer backup dos arquivos exportados em outro local</li>
                                </ul>
                            `

                                <p>O W.Tracks oferece diferentes formatos de exportação para atender diversas necessidades — desde compartilhamento rápido até produção profissional. Entender as diferenças entre os formatos ajuda você a escolher o mais adequado para cada situação, garantindo qualidade e compatibilidade conforme necessário.</p>

                                <h3>MP3 - Formato comprimido</h3>
                                <p>O MP3 é o formato mais comum para uso cotidiano:</p>

                                    <li><strong>Uso ideal:</strong> Compartilhamento, streaming, prévias, uso em dispositivos móveis</li>
                                    <li><strong>Não recomendado para:</strong> Edição profissional posterior, masterização final</li>
                                </ul>
                                
                                <h3>WAV - Formato profissional</h3>
                                <p>O WAV é o formato padrão da indústria musical:</p>
                                <ul>
                                    <li><strong>Qualidade:</strong> Sem perda de qualidade — áudio idêntico ao original</li>
                                    <li><strong>Tamanho:</strong> Arquivos muito grandes — 10x ou mais que MP3 equivalente</li>

                                    <li><strong>Bit depth:</strong> 16-bit (padrão CD) ou 24-bit (maior resolução dinâmica)</li>

                                <h3>Stems individuais</h3>

                                <h3>Stems em ZIP</h3>
                                <p>O ZIP organiza múltiplos stems em um pacote:</p>
                                <ul>
                                    <li><strong>Conteúdo:</strong> Todos os stems individuais compactados em um arquivo</li>

                        {
                            id: 'qualidade-exportacao',
                            title: 'Como escolher a qualidade de exportação?',
                            content: `
                                <p>A qualidade da exportação determina como seu áudio soará e o tamanho dos arquivos resultantes. Escolher a qualidade certa é um equilíbrio entre fidelidade sonora e praticidade — qualidade muito alta gera arquivos enormes, enquanto qualidade muito baixa compromete o som. Entender os parâmetros de qualidade ajuda você a tomar decisões informadas.</p>
                                
                                <h3>Parâmetros de qualidade</h3>
                                <p>Os principais parâmetros que controlam a qualidade são:</p>
                                <ul>
                                    <li><strong>Bitrate (MP3):</strong> Quantidade de dados por segundo — determina compressão</li>
                                    <li><strong>Sample rate:</strong> Amostragem por segundo — determina faixa de frequências</li>
                                    <li><strong>Bit depth:</strong> Resolução de cada amostra — determina dinâmica</li>
                                    <li><strong>Canais:</strong> Mono ou estéreo — determina espacialização do som</li>
                                </ul>
                                
                                <h3>Bitrate MP3</h3>
                                <p>O bitrate é o parâmetro mais importante para MP3:</p>
                                <ul>
                                    <li><strong>128kbps:</strong> Qualidade básica, arquivos pequenos, audível mas com perdas perceptíveis</li>
                                    <li><strong>192kbps:</strong> Qualidade média, bom equilíbrio entre tamanho e qualidade</li>
                                    <li><strong>256kbps:</strong> Alta qualidade, pouca perda perceptível para maioria dos usos</li>
                                    <li><strong>320kbps:</strong> Máxima qualidade MP3, perdas mínimas, arquivos maiores</li>
                                </ul>
                                
                                <h3>Quando usar cada bitrate MP3</h3>
                                <p>Guia prático de bitrate:</p>
                                <ul>
                                    <li><strong>128kbps:</strong> Voz, podcasts, conteúdo onde áudio não é o foco principal</li>
                                    <li><strong>192kbps:</strong> Música casual, prévias, compartilhamento por mensageiros</li>
                                    <li><strong>256kbps:</strong> Streaming, distribuição digital, uso geral de alta qualidade</li>
                                    <li><strong>320kbps:</strong> Arquivamento pessoal, quando qualidade é crítica mas precisa de MP3</li>
                                </ul>
                                
                                <h3>Sample rate</h3>
                                <p>O sample rate determina a faixa de frequências capturadas:</p>
                                <ul>
                                    <li><strong>44.1kHz:</strong> Padrão CD, captura frequências até 22.05kHz (suficiente para audição humana)</li>
                                    <li><strong>48kHz:</strong> Padrão vídeo/cinema, margem extra para processamento digital</li>
                                    <li><strong>96kHz:</strong> Alta resolução, usado em produção profissional avançada</li>
                                </ul>
                                
                                <h3>Escolhendo o sample rate</h3>
                                <p>Para a maioria dos usos:</p>
                                <ul>
                                    <li><strong>44.1kHz:</strong> Suficiente para música, streaming, CDs — use se não tem motivo específico para outro</li>
                                    <li><strong>48kHz:</strong> Use se o áudio será usado em vídeo ou precisa de margem para processamento</li>
                                    <li><strong>96kHz:</strong> Produção profissional avançada, arquivamento de máximo qualidade</li>
                                </ul>
                                
                                <h3>Bit depth</h3>
                                <p>O bit depth determina a resolução dinâmica:</p>
                                <ul>
                                    <li><strong>16-bit:</strong> Padrão CD, 65.536 níveis de amplitude, suficiente para maioria das aplicações</li>
                                    <li><strong>24-bit:</strong> Alta resolução, 16.777.216 níveis, maior margem para processamento</li>
                                    <li><strong>32-bit float:</strong> Máxima resolução, usado em produção profissional moderna</li>
                                </ul>
                                
                                <h3>Escolhendo o bit depth</h3>
                                <p>Recomendações práticas:</p>

                                    <li><strong>32-bit:</strong> Produção profissional avançada, quando máximo espaço dinâmico é necessário</li>
                                </ul>
                                
                                <h3>Mono vs Estéreo</h3>
                                <p>A escolha de canais afeta a espacialização:</p>
                                <ul>
                                    <li><strong>Mono:</strong> 1 canal, arquivo menor, ideal para voz, podcasts, conteúdo focado em fala</li>

                                <h3>Combinando parâmetros</h3>

                                <ul>

                            title: 'O que fazer se uma música não carrega?',
                            content: `
                                <p>Quando uma música não carrega no W.Tracks, pode ser frustrante, mas geralmente há causas identificáveis e soluções disponíveis. O problema pode estar no arquivo em si, na sua conexão, no navegador ou em uma combinação de fatores. Entender a causa raiz ajuda a resolver o problema mais rapidamente e evitar que ele se repita.</p>
                                
                                <h3>Causas comuns de não-carregamento</h3>
                                <p>As causas mais frequentes para músicas não carregarem incluem:</p>
                                <ul>
                                    <li><strong>Problemas de conexão:</strong> Conexão instável, lenta ou interrompida durante o upload/download</li>
                                    <li><strong>Formato incompatível:</strong> Arquivo em formato não suportado ou corrompido</li>
                                    <li><strong>Arquivo corrompido:</strong> O arquivo de áudio está danificado ou incompleto</li>
                                    <li><strong>Problemas de navegador:</strong> Cache antigo, extensões conflitantes ou versão desatualizada</li>
                                    <li><strong>Limitações de recursos:</strong> Memória insuficiente ou processamento sobrecarregado</li>
                                    <li><strong>Problemas temporários do sistema:</strong> Falhas momentâneas nos servidores ou na comunicação</li>
                                </ul>
                                
                                <h3>Soluções passo a passo</h3>
                                <p>Quando uma música não carrega, siga estes passos de solução de problemas:</p>
                                
                                <p><strong>1. Verifique sua conexão com a internet</strong></p>
                                <ul>
                                    <li>Teste se outros sites funcionam normalmente</li>
                                    <li>Se estiver em Wi-Fi, tente conectar por cabo se possível</li>
                                    <li>Se estiver em dados móveis, verifique se tem sinal suficiente</li>
                                    <li>Reinicie seu roteador ou modem se suspeitar de problemas de rede</li>
                                </ul>
                                
                                <p><strong>2. Tente recarregar a página</strong></p>
                                <ul>
                                    <liÀs vezes um simples refresh resolve problemas temporários de comunicação</li>
                                    <li>Se estiver usando o W.Tracks em uma aba específica, tente abrir em uma nova aba</li>
                                    <li>Limpe o cache do navegador para eliminar dados antigos que possam causar conflitos</li>
                                </ul>
                                
                                <p><strong>3. Verifique o formato do arquivo</strong></p>
                                <ul>
                                    <li>O W.Tracks suporta MP3, WAV, FLAC, AAC e outros formatos principais</li>
                                    <li>Formatos menos comuns podem não ser compatíveis — tente converter para MP3 ou WAV</li>
                                    <li>Arquivos com extensões muito incomuns ou proprietárias podem não funcionar</li>
                                    <li>Use um conversor de áudio confiável se precisar mudar o formato</li>
                                </ul>
                                
                                <p><strong>4. Teste o arquivo em outro player</strong></p>
                                <ul>
                                    <li>Abra o arquivo em outro player de áudio (VLC, Windows Media Player, etc.)</li>
                                    <li>Se não tocar em nenhum player, o arquivo provavelmente está corrompido</li>
                                    <li>Se toca em outros players mas não no W.Tracks, pode ser um problema de compatibilidade específico</li>
                                </ul>
                                
                                <p><strong>5. Tente fazer upload novamente</strong></p>
                                <ul>
                                    <li>Às vezes o upload é interrompido sem aviso claro</li>
                                    <li>Exclua o arquivo que não carregou e tente fazer upload novamente</li>
                                    <li>Se estiver fazendo upload de múltiplos arquivos, tente um por vez para identificar qual está causando problema</li>
                                </ul>
                                
                                <p><strong>6. Verifique o navegador</strong></p>
                                <ul>
                                    <li>Tente usar um navegador diferente (Chrome, Firefox, Safari, Edge)</li>
                                    <li>Verifique se há atualizações disponíveis para seu navegador</li>
                                    <li>Desative extensões temporariamente — algumas podem interferir com o funcionamento</li>
                                    <li>No modo privado/incógnito, extensões são desativadas automaticamente — teste nesse modo</li>
                                </ul>
                                
                                <h3>Problemas específicos por plataforma</h3>
                                <p><strong>Em computadores:</strong></p>
                                <ul>
                                    <li>Verifique se há espaço suficiente em disco para o processamento de arquivos grandes</li>
                                    <li>Feche outros programas que possam estar consumindo muitos recursos</li>
                                    <li>Verifique se seu antivírus está bloqueando alguma operação do W.Tracks</li>
                                </ul>
                                
                                <p><strong>Em dispositivos móveis:</strong></p>
                                <ul>
                                    <li>Verifique se o aplicativo tem permissão para acessar armazenamento</li>
                                    <li>Certifique-se de que há espaço suficiente no dispositivo</li>
                                    <li>Em iOS, verifique as configurações de privacidade do aplicativo</li>
                                    <li>Em Android, verifique as permissões de armazenamento nas configurações do app</li>
                                </ul>
                                
                                <h3>Quando entrar em contato com o suporte</h3>
                                <p>Se você tentou todas as soluções acima e o problema persiste, entre em contato com o suporte. Para ajudar a resolver o problema mais rapidamente, forneça estas informações:</p>
