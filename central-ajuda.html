                        {
                            id: 'app-fecha-sozinho',
                            title: 'O que fazer se o app fechar sozinho?',
                            content: `
                                <p>Quando o W.Tracks fecha sozinho inesperadamente, geralmente é devido a problemas de recursos — especifically memória ou processamento. O W.Tracks é uma aplicação intensiva em recursos, especialmente quando trabalha com projetos grandes, muitos arquivos de áudio simultâneos, ou processamento complexo de efeitos. Entender por que isso acontece ajuda a resolver o problema e melhorar a estabilidade.</p>
                                
                                <h3>Causas principais de fechamento inesperado</h3>
                                <p>As causas mais comuns para o app fechar sozinho incluem:</p>
                                <ul>
                                    <li><strong>Excesso de memória:</strong> O projeto requer mais memória RAM do que está disponível</li>
                                    <li><strong>Processamento sobrecarregado:</strong> Muitas tracks simultâneas exigindo processamento em tempo real</li>
                                    <li><strong>Arquivos muito grandes:</strong> Arquivos de áudio de alta qualidade consomem muitos recursos</li>
                                    <li><strong>Conflitos de software:</strong> Outros programas competindo pelos mesmos recursos</li>
                                    <li><strong>Problemas de navegador:</strong> Versões desatualizadas ou bugs específicos de certos navegadores</li>
                                    <li><strong>Dispositivo insuficiente:</strong> Hardware muito antigo ou abaixo dos requisitos mínimos</li>
                                </ul>
                                
                                <h3>Soluções imediatas</h3>
                                <p>Quando o app fecha sozinho, tente estas soluções imediatas:</p>
                                
                                <p><strong>1. Feche outros programas e abas</strong></p>
                                <ul>
                                    <li>Feche outras abas do navegador que não esteja usando</li>
                                    <li>Feche outros programas pesados (editores de vídeo, jogos, etc.)</li>
                                    <li>No gerenciador de tarefas, verifique quais programas estão consumindo mais recursos</li>
                                    <li>Desative temporariamente antivírus ou firewalls se suspeitar que estão interferindo</li>
                                </ul>
                                
                                <p><strong>2. Reduza a complexidade do projeto</strong></p>
                                <ul>
                                    <li>Se o projeto tem muitas tracks, considere dividir em projetos menores</li>
                                    <li>Use mute em tracks que não está ouvindo para reduzir processamento</li>
                                    <li>Reduza o número de efeitos ativos simultaneamente</li>
                                    <li>Use arquivos de áudio com menor qualidade se possível (MP3 em vez de WAV)</li>
                                </ul>
                                
                                <p><strong>3. Otimize seu dispositivo</strong></p>
                                <ul>
                                    <li>Reinicie seu computador ou dispositivo móvel para liberar recursos</li>
                                    <li>Verifique se há atualizações de sistema disponíveis</li>
                                    <li>Em computadores, considere adicionar mais memória RAM se possível</li>
                                    <li>Verifique o espaço em disco — pouco espaço livre pode causar problemas de performance</li>
                                </ul>
                                
                                <p><strong>4. Ajuste as configurações do navegador</strong></p>
                                <ul>
                                    <li>Aumente o limite de memória do navegador se a opção estiver disponível</li>
                                    <li>Desabilite aceleração de hardware se estiver causando problemas</li>
                                    <li>Use um navegador mais eficiente (Chrome geralmente gerencia memória melhor que outros)</li>
                                    <li>Limpe o cache e cookies do navegador</li>
                                </ul>
                                
                                <h3>Soluções específicas por plataforma</h3>
                                <p><strong>Em computadores Windows:</strong></p>
                                <ul>
                                    <li>Abra o Gerenciador de Tarefas para ver o uso de recursos</li>
                                    <li>Verifique se há atualizações de drivers disponíveis</li>
                                    <li>Desabilite programas de inicialização automática que não são necessários</li>
                                    <li>Execute uma verificação de malware para garantir que não há programas maliciosos consumindo recursos</li>
                                </ul>
                                
                                <p><strong>Em computadores Mac:</strong></p>
                                <ul>
                                    <li>Abra o Monitor de Atividade para ver o uso de recursos</li>
                                    <li>Verifique se há atualizações de macOS disponíveis</li>
                                    <li>Gerencie itens de login para reduzir programas em execução automática</li>
                                    <li>Reinicie em modo de segurança para testar se o problema persiste</li>
                                </ul>
                                
                                <p><strong>Em dispositivos móveis (iOS/Android):</strong></p>
                                <ul>
                                    <li>Feche todos os outros aplicativos em segundo plano</li>
                                    <li>Reinicie o dispositivo completamente</li>
                                    <li>Verifique se há atualizações do sistema disponíveis</li>
                                    <li>Em Android, verifique as configurações de desenvolvedor para limites de memória</li>
                                    <li>Considere usar um dispositivo mais potente se o problema for recorrente</li>
                                </ul>
                                
                                <h3>Prevenção de fechamentos futuros</h3>
                                <p>Para evitar que o app feche sozinho no futuro:</p>
                                <ul>
                                    <li>Gerencie seus projetos para não ficarem excessivamente grandes</li>
                                    <li>Use formatos de áudio otimizados (MP3 em vez de WAV quando possível)</li>
                                    <li>Mantenha seu dispositivo limpo de programas desnecessários</li>
                                    <li>Atualize regularmente navegador, sistema e drivers</li>
                                    <li>Monitore o uso de recursos enquanto trabalha para identificar padrões</li>
                                </ul>
                                
                                <h3>Quando o problema indica hardware insuficiente</h3>
                                <p>Se você consistentemente enfrenta fechamentos mesmo após otimizações, pode ser que seu hardware não seja adequado para o tipo de trabalho que está tentando fazer:</p>
                                <ul>
                                    <li>Considere usar um computador mais potente para projetos grandes</li>
                                    <li>Para projetos profissionais, verifique os requisitos recomendados do W.Tracks</li>
                                    <li>Em alguns casos, usar a versão desktop do aplicativo (se disponível) pode ser mais estável que a versão web</li>
                                </ul>
                                
                                <h3>Relatando o problema ao suporte</h3>
                                <p>Se o problema persistir mesmo após tentar todas as soluções, entre em contato com o suporte com estas informações:</p>
                                <ul>
                                    <li>Seu hardware (modelo de computador/dispositivo, quantidade de RAM, processador)</li>
                                    <li>Seu sistema operacional e versão</li>
                                    <li>Navegador e versão</li>
                                    <li>Tamanho e complexidade do projeto (número de tracks, tamanho dos arquivos)</li>
                                    <li>Se o problema acontece com todos os projetos ou apenas com projetos específicos</li>
                                    <li>Se há algum padrão (por exemplo, sempre acontece quando você adiciona uma nova track)</li>
                                </ul>
                                
                                <h3>Salvamento automático</h3>
                                <p>O W.Tracks implementa salvamento automático para minimizar perdas de trabalho em caso de fechamentos inesperados. Se o app fechar sozinho, geralmente seu trabalho mais recente é preservado. Ao reabrir o projeto, verifique se há um aviso sobre recuperação de trabalho não salvo — isso indica que o sistema detectou o fechamento anormal e preservou seu progresso.</p>
                            `
                        },
                        {
                            id: 'modo-offline',
                            title: 'Como funciona o modo offline?',
                            content: `
                                <p>O modo offline do W.Tracks permite que você continue trabalhando mesmo sem conexão com a internet, embora com algumas limitações. Esta funcionalidade é especialmente útil para músicos que trabalham em locais com conectividade instável, em viagens, ou simplesmente preferem ter a opção de trabalhar desconectados. Entender como funciona o modo offline ajuda a gerenciar expectativas e aproveitar melhor essa funcionalidade.</p>
                                
                                <h3>O que funciona offline</h3>
                                <p>Quando você está sem conexão com a internet, várias funcionalidades continuam disponível:</p>
                                <ul>
                                    <li><strong>Projetos já baixados:</strong> Projetos que você já acessou anteriormente e foram baixados para seu dispositivo ficam disponíveis offline</li>
                                    <li><strong>Reprodução de áudio:</strong> Você pode ouvir músicas que já estão em cache local</li>
                                    <li><strong>Controles do mixer:</strong> Faders, pan, mute e solo funcionam normalmente em projetos baixados</li>
                                    <li><strong>Loops e efeitos básicos:</strong> Funcionalidades que não dependem de comunicação com servidores continuam operando</li>
                                    <li><strong>Edição local:</strong> Alterações que ficam salvas localmente podem ser feitas e sincronizadas depois</li>
                                </ul>
                                
                                <h3>O que não funciona offline</h3>
                                <p>Algumas funcionalidades requerem conexão e ficam indisponíveis offline:</p>
                                <ul>
                                    <li><strong>Novos uploads:</strong> Você não pode fazer upload de novos arquivos de áudio sem conexão</li>
                                    <li><strong>Download de projetos:</strong> Projetos que ainda não foram baixados não ficam disponíveis</li>
                                    <li><strong>Sincronização:</strong> Alterações feitas offline não são sincronizadas até a conexão voltar</li>
                                    <li><strong>Recursos de nuvem:</strong> Funcionalidades que dependem da nuvem ficam limitadas</li>
                                    <li><strong>Atualizações:</strong> O app não pode verificar por atualizações ou baixar novas versões</li>
                                    <li><strong>Colaboração:</strong> Recursos que envolvem comunicação com outros usuários não funcionam</li>
                                </ul>
                                
                                <h3>Como o cache local funciona</h3>
                                <p>O W.Tracks usa um sistema inteligente de cache para permitir funcionamento offline:</p>
                                <ul>
                                    <li>Quando você acessa um projeto pela primeira vez, os arquivos são baixados para cache local</li>
                                    <li>Esse cache persiste mesmo quando você fecha o navegador ou o app</li>
                                    <li>O sistema gerencia automaticamente o espaço do cache, removendo arquivos antigos quando necessário</li>
                                    <li>Projetos que você usa com frequência tendem a permanecer mais tempo no cache</li>
                                    <li>Você pode controlar manualmente quais projetos manter offline (se essa opção estiver disponível)</li>
                                </ul>
                                
                                <h3>Sincronização quando a conexão volta</h3>
                                <p>Quando você reconecta à internet, a sincronização ocorre automaticamente:</p>
                                <ul>
                                    <li>Alterações feitas offline são enviadas para a nuvem</li>
                                    <li>Atualizações feitas em outros dispositivos são baixadas</li>
                                    <li>Conflitos são resolvidos automaticamente quando possível</li>
                                    <li>O sistema notifica se houver problemas que precisem de atenção manual</li>
                                </ul>
                                
                                <h3>Gerenciamento de cache offline</h3>
                                <p>Para otimizar o funcionamento offline:</p>
                                <ul>
                                    <li>Antes de ficar offline, acesse os projetos que você pretende usar para garantir que estejam em cache</li>
                                    <li>Se você tem muitos projetos, priorize os mais importantes para manter offline</li>
                                    <li>Em dispositivos com pouco armazenamento, o cache pode ser limitado — gerencie conscientemente</li>
                                    <li>Limpe o cache periodicamente se estiver ocupando muito espaço</li>
                                </ul>
                                
                                <h3>Limitações do modo offline</h3>
                                <p>É importante entender as limitações do modo offline:</p>
                                <ul>
                                    <li>O espaço disponível em cache é limitado pelo armazenamento do dispositivo</li>
                                    <li>Projetos muito grandes podem não caber completamente no cache</li>
                                    <li>A funcionalidade offline é complementar, não substituta completa para uso conectado</li>
                                    <li>Alguns recursos avançados podem estar sempre indisponíveis offline</li>
                                </ul>
                                
                                <h3>Uso prático do modo offline</h3>
                                <p>Cenários onde o modo offline é especialmente útil:</p>
                                <ul>
                                    <li><strong>Viagens:</strong> Trabalhar em aviões, trens ou locais com Wi-Fi instável</li>
                                    <li><strong>Apresentações ao vivo:</strong> Ter certeza de que o material estará disponível mesmo se a rede falhar</li>
                                    <li><strong>Áreas remotas:</strong> Trabalhar em locais com conectividade limitada ou inexistente</li>
                                    <li><strong>Economia de dados:</strong> Pré-baixar projetos para usar depois sem consumir dados móveis</li>
                                </ul>
                                
                                <h3>Recomendações para melhor experiência offline</h3>
                                <p>Para aproveitar ao máximo o modo offline:</p>
                                <ul>
                                    <li>Planeje antecipadamente — baixe os projetos necessários antes de ficar offline</li>
                                    <li>Gerencie o espaço de armazenamento do dispositivo para ter cache suficiente</li>
                                    <li>Teste o funcionamento offline antes de situações críticas (apresentações, etc.)</li>
                                    <li>Mantenha uma conexão estável sempre que possível para sincronização regular</li>
                                    <li>Entenda quais funcionalidades são essenciais offline e quais podem esperar</li>
                                </ul>
                                
                                <h3>Desempenho offline vs online</h3>
                                <p>Geralmente, o desempenho offline é excelente ou até melhor que online, pois:</p>
                                <ul>
                                    <li>Não há latência de rede — tudo é carregado localmente</li>
                                    <li>Não há dependência da velocidade da conexão</li>
                                    <li>O processamento é inteiramente local, sem comunicação com servidores</li>
                                </ul>
                                
                                <p>No entanto, você perde os benefícios da nuvem — sincronização, backup automático, acesso multi-dispositivo. Por isso, o modo offline é ideal para situações temporárias, mas o uso conectado continua sendo recomendado para a experiência completa do W.Tracks.</p>
                                
                                <h3>Futuro do modo offline</h3>
                                <p>O sistema offline do W.Tracks está em constante evolução. Recursos futuros podem incluir:</p>
                                <ul>
                                    <li>Controle mais granular sobre quais projetos manter offline</li>
                                    <li>Indicadores claros de quais projetos estão disponíveis offline</li>
                                    <li>Sincronização seletiva (escolher o que sincronizar quando a conexão voltar)</li>
                                    <li>Melhor gerenciamento de espaço e priorização de cache</li>
                                </ul>
                            `
                        }

                        {
                            id: 'como-funciona-sync',
                            title: 'Como funciona a sincronização?',
                            content: `
                                <div class="info-box">
                                    <strong>Recurso Track Pro:</strong> A sincronização na nuvem está disponível exclusivamente no plano Track Pro. Usuários do plano gratuito não têm acesso a este recurso.
                                </div>
                                
                                <p>A sincronização entre dispositivos é uma das funcionalidades mais poderosas do W.Tracks, permitindo que você acesse seus projetos e músicas de qualquer lugar, em qualquer dispositivo, sem precisar transferir arquivos manualmente. Esta funcionalidade transforma o W.Tracks de uma simples ferramenta de reprodução em um ecossistema completo onde seu trabalho musical acompanha você para onde quer que vá.</p>
                                
                                <h3>Conceito fundamental: nuvem vinculada à conta</h3>
                                <p>A sincronização funciona através de um conceito simples mas poderoso: seus dados ficam salvos na nuvem associados à sua conta de usuário, não ao aparelho específico que você está usando. Isso significa que seus projetos não ficam "presos" no computador onde foram criados — eles existem independentemente de qualquer dispositivo físico, acessíveis sempre que você fizer login.</p>
                                
                                <p>Quando você cria um projeto, adiciona músicas ou faz alterações no mixer, tudo isso é enviado automaticamente para a nuvem e vinculado ao seu perfil. A nuvem funciona como um repositório central que mantém seus dados seguros e disponíveis, servindo como fonte única de verdade para suas informações.</p>
                                
                                <h3>Processo de salvamento na nuvem</h3>
                                <p>O salvamento na nuvem acontece de forma automática e transparente. Sempre que você faz uma alteração significativa — cria um projeto, adiciona uma track, ajusta o mixer — o sistema envia essas informações para a nuvem em tempo real. Você não precisa clicar em "salvar" ou "sincronizar" manualmente; o processo é contínuo e acontece nos bastidores enquanto você trabalha.</p>
                                
                                <p>Esse salvamento automático inclui todas as informações do projeto: metadados (nome, capa, descrição), configurações do mixer (volumes, pan, mute, solo), e os próprios arquivos de áudio das tracks. Tudo é enviado de forma segura e criptografada, garantindo que seus dados estejam protegidos durante o trânsito e no armazenamento.</p>
                                
                                <h3>Acesso em outros dispositivos</h3>
                                <p>A mágica da sincronização acontece quando você acessa o W.Tracks em outro dispositivo. O processo é surpreendentemente simples:</p>
                                <ul>
                                    <li>Abra o W.Tracks no novo dispositivo (computador, tablet ou celular)</li>
                                    <li>Faça login com as mesmas credenciais (e-mail e senha) que você usa no dispositivo original</li>
                                    <li>O sistema reconhece sua conta e conecta-se à nuvem onde seus dados estão salvos</li>
                                    <li>Sua biblioteca de projetos aparece automaticamente, exatamente como você deixou no outro dispositivo</li>
                                    <li>Todas as configurações e preferências também são carregadas</li>
                                </ul>
                                
                                <p>Não há necessidade de configurar nada adicional, não há necessidade de transferir arquivos manualmente, e não há necessidade de escolher quais projetos sincronizar — tudo acontece automaticamente e de forma inteligente.</p>
                                
                                <h3>Download sob demanda (sob demanda)</h3>
                                <p>Um aspecto crucial da sincronização do W.Tracks é o sistema de download sob demanda. Quando você troca de dispositivo, o app baixa localmente apenas o que você for usar naquele momento, não todos os seus arquivos de uma vez. Esta abordagem inteligente traz vários benefícios importantes:</p>
                                
                                <ul>
                                    <li><strong>Economia de espaço:</strong> Se você tem muitos projetos com arquivos grandes, baixar tudo de uma vez encheria rapidamente o armazenamento do dispositivo. Com download sob demanda, apenas os projetos que você realmente usa ocupam espaço local</li>
                                    <li><strong>Economia de dados:</strong> Em conexões móveis com limite de dados, baixar tudo consumiria sua cota rapidamente. O download sob demanda usa dados apenas quando necessário</li>
                                    <li><strong>Velocidade:</strong> Baixar apenas o essencial significa que o app fica disponível para uso mais rápido, sem esperar grandes downloads completos</li>
                                    <li><strong>Flexibilidade:</strong> Você pode ter milhares de projetos na nuvem, mas apenas alguns ocupam espaço no seu dispositivo</li>
                                </ul>
                                
                                <h3>Como funciona o download sob demanda?</h3>
                                <p>O sistema funciona de forma inteligente e previsível:</p>
                                <ul>
                                    <li>Quando você abre um projeto pela primeira vez em um novo dispositivo, os metadados (nome, capa, configurações) são baixados imediatamente — isso é rápido pois são apenas informações textuais</li>
                                    <li>Os arquivos de áudio só são baixados quando você realmente precisa tocá-los — ou seja, quando você dá play naquele projeto</li>
                                    <li>Se você tem um projeto com 10 tracks, o sistema pode baixar apenas as tracks que você realmente ouve, deixando as outras para baixar apenas se você decidir tocá-las</li>
                                    <li>Arquivos baixados ficam em cache local, então se você ouvir o mesmo projeto novamente, não precisará baixar de novo</li>
                                    <li>O sistema gerencia automaticamente o cache, removendo arquivos antigos não usados quando o espaço começa a ficar escasso</li>
                                </ul>
                                
                                <h3>Sincronização bidirecional</h3>
                                <p>A sincronização não é apenas de nuvem para dispositivo — ela funciona nos dois sentidos. Se você fizer alterações no celular, essas alterações são enviadas para a nuvem e ficam disponíveis no computador. Se você criar um novo projeto no tablet, ele aparecerá no computador e no celular. Todos os dispositivos sincronizados com sua conta ficam consistentes entre si, com a nuvem servindo como ponto central de coordenação.</p>
                                
                                <h3>Resolução de conflitos</h3>
                                <p>Em situações raras onde você edita o mesmo projeto em dois dispositivos simultaneamente sem conexão, o sistema de sincronização precisa resolver conflitos. O W.Tracks usa estratégias inteligentes para isso, geralmente priorizando a versão mais recente ou mesclando alterações quando possível. Em casos extremos, você pode ser solicitado a escolher qual versão manter, mas o sistema é projetado para minimizar essas situações.</p>
                                
                                <h3>Segurança na sincronização</h3>
                                <p>Toda a comunicação entre seu dispositivo e a nuvem é criptografada, garantindo que seus dados estejam protegidos durante o trânsito. Além disso, o acesso à nuvem é controlado estritamente pela sua autenticação — apenas dispositivos onde você faz login com suas credenciais podem acessar seus dados. Se você perder um dispositivo, pode revogar o acesso remotamente através das configurações da conta.</p>
                                
                                <h3>Benefícios práticos do dia a dia</h3>
                                <p>A sincronização transforma o fluxo de trabalho musical:</p>
                                <ul>
                                    <li>Comece um projeto no computador em casa, continue no tablet durante o trajeto, finalize no celular no estúdio</li>
                                    <li>Compartilhe projetos com colaboradores sem precisar enviar arquivos grandes por e-mail</li>
                                    <li>Backup automático — seus projetos estão sempre seguros na nuvem, mesmo se seu computador falhar</li>
                                    <li>Acesse sua biblioteca completa de qualquer lugar, sem precisar carregar HDs externos</li>
                                    <li>Trabalhe em múltiplos projetos simultaneamente em diferentes dispositivos sem conflitos</li>
                                </ul>
                                
                                <h3>Limitações e considerações</h3>
                                <p>Embora poderosa, a sincronização tem algumas limitações a considerar:</p>
                                <ul>
                                    <li>Requer conexão com internet para funcionar — sem conexão, você só acessa o que já foi baixado localmente</li>
                                    <li>Grandes projetos podem demorar para baixar na primeira vez, dependendo da velocidade da conexão</li>
                                    <li>O plano gratuito não inclui sincronização — este é um recurso exclusivo do Track Pro</li>
                                    <li>Dispositivos muito antigos podem ter dificuldade com projetos muito grandes</li>
                                </ul>
                                
                                <h3>Futuro da sincronização</h3>
                                <p>O sistema de sincronização do W.Tracks está em constante evolução. Recursos futuros podem incluir sincronização seletiva (escolher quais projetos sincronizar), compartilhamento colaborativo em tempo real, e otimizações ainda mais inteligentes de cache e download. A infraestrutura está sendo construída para escalar conforme mais usuários adotam o recurso.</p>
                            `
                        }
                    ]

                            title: 'Como funciona o login?',
                            content: `
                                <p>O sistema de login do W.Tracks é projetado com segurança como prioridade absoluta, usando autenticação robusta por e-mail e senha combinada com práticas modernas de proteção de identidade. O login não é apenas uma porta de entrada — é um sistema completo de segurança que protege sua conta, seus dados e sua privacidade em múltiplas camadas.</p>
                                
                                <h3>Processo de autenticação</h3>
                                <p>Quando você faz login no W.Tracks, ocorre um processo de autenticação em várias etapas:</p>
                                <ul>
                                    <li>Você insere seu e-mail e senha na interface de login</li>
                                    <li>O sistema criptografa essas informações antes de enviá-las pela rede</li>
                                    <li>As credenciais criptografadas são enviadas para os servidores do W.Tracks</li>
                                    <li>O sistema verifica se o e-mail corresponde a uma conta existente</li>
                                    <li>A senha é comparada com a versão criptografada armazenada — nunca com a senha em texto original</li>
                                    <li>Se as credenciais estiverem corretas, o sistema cria um acesso temporário seguro</li>
                                    <li>Esse acesso temporário é enviado de volta ao seu dispositivo e armazenado localmente</li>
                                </ul>
                                
                                <h3>O acesso temporário (sessão)</h3>
                                <p>Após o login bem-sucedido, o sistema cria um acesso temporário que funciona como sua identidade durante o uso. Esse acesso temporário tem várias características importantes:</p>
                                <ul>
                                    <li><strong>É exclusivo para seu dispositivo:</strong> Cada login gera um acesso temporário único que só funciona naquele dispositivo específico</li>
                                    <li><strong>Tem validade limitada:</strong> O acesso expira após um período de inatividade por segurança — se você não usar por um tempo, precisa fazer login novamente</li>
                                    <li><strong>É revogável:</strong> Se você fizer logout ou se houver suspeita de comprometimento, o acesso pode ser revogado imediatamente</li>
                                    <li><strong>Contém informações limitadas:</strong> O acesso temporário não contém sua senha, apenas informações mínimas necessárias para identificar você</li>
                                </ul>
                                
                                <p>Esse sistema de acesso temporário permite que você continue usando o W.Tracks sem precisar digitar a senha toda vez, ao mesmo tempo em que mantém segurança — se alguém obtiver acesso ao seu dispositivo, não conseguirá usar suas credenciais em outros dispositivos, e o acesso expirará automaticamente após um período.</p>
                                
                                <h3>Proteção da senha</h3>
                                <div class="info-box">
                                    <strong>Crucial:</strong> Sua senha nunca é armazenada em texto puro ou visível. Ela é protegida com técnicas de segurança avançadas que impedem que alguém possa vê-la, mesmo que tenha acesso físico aos sistemas internos ou aos bancos de dados.
                                </div>
                                
                                <p>A proteção da senha funciona através de um processo chamado "hashing". Quando você cria sua conta ou altera sua senha:</p>
                                <ul>
                                    <li>A senha é transformada matematicamente em uma sequência de caracteres aparentemente aleatória (o hash)</li>
                                    <li>Essa transformação é unidirecional — não é possível reverter o hash para obter a senha original</li>
                                    <li>Apenas o hash é armazenado nos sistemas do W.Tracks, nunca a senha em si</li>
                                    <li>Quando você faz login, a senha que você digita passa pelo mesmo processo de hashing</li>
                                    <li>O sistema compara os hashes — se forem idênticos, a senha está correta</li>
                                </ul>
                                
                                <p>Isso significa que mesmo se alguém obtivesse acesso aos bancos de dados do W.Tracks, não conseguiria descobrir sua senha, pois apenas o hash estaria disponível, e não é possível reverter o hash para obter a senha original.</p>
                                
                                <h3>Expiração por segurança</h3>
                                <p>O acesso temporário expira por segurança — isso é normal e intencional. A expiração ocorre em várias situações:</p>
                                <ul>
                                    <li><strong>Inatividade:</strong> Se você não usar o W.Tracks por um período prolongado (geralmente dias ou semanas), o acesso expira automaticamente</li>
                                    <li><strong>Logout manual:</strong> Quando você clica em "Sair", o acesso é revogado imediatamente</li>
                                    <li><strong>Mudança de senha:</strong> Se você alterar sua senha, todos os acessos temporários existentes são invalidados</li>
                                    <li><strong>Suspeita de comprometimento:</strong> Se o sistema detectar atividade suspeita, pode revogar acessos preventivamente</li>
                                </ul>
                                
                                <p>Quando o acesso expira, você só precisa fazer login novamente. Isso pode parecer inconveniente, mas é uma medida importante de segurança que protege sua conta contra uso não autorizado.</p>
                                
                                <h3>Detecção de atividades suspeitas</h3>
                                <p>O sistema de login monitora atividades para detectar comportamentos anormais que possam indicar comprometimento da conta. Isso inclui:</p>
                                <ul>
                                    <li>Tentativas de login de locais geográficos incomuns</li>
                                    <li>Múltiplas tentativas de login falhas consecutivas</li>
                                    <li>Login em dispositivos completamente diferentes dos usuais</li>
                                    <li>Padrões de uso que diferem drasticamente do normal</li>
                                </ul>
                                
                                <p>Quando o sistema detecta algo suspeito, pode tomar medidas como exigir verificação adicional, bloquear temporariamente o acesso, ou notificar você sobre a atividade incomum.</p>
                                
                                <h3>Recuperação de conta</h3>
                                <p>Se você esquecer sua senha ou suspeitar que sua conta foi comprometida, o processo de recuperação é seguro:</p>
                                <ul>
                                    <li>A recuperação é iniciada através do e-mail cadastrado na conta</li>
                                    <li>Um link seguro é enviado para seu e-mail, válido por tempo limitado</li>
                                    <li>Apenas alguém com acesso ao e-mail pode recuperar a conta</li>
                                    <li>Após a recuperação, todos os acessos temporários existentes são revogados</li>
                                    <li>Você é incentivado a criar uma nova senha forte</li>
                                </ul>
                                
                                <h3>Boas práticas de segurança</h3>
                                <p>Embora o W.Tracks implemente robustas medidas de segurança, sua própria segurança também depende de boas práticas:</p>
                                <ul>
                                    <li>Use senhas fortes e únicas para o W.Tracks — não reutilize senhas de outros sites</li>
                                    <li>Nunca compartilhe sua senha com outras pessoas</li>
                                    <li>Seja cauteloso com e-mails de phishing que parecem ser do W.Tracks mas não são</li>
                                    <li>Mantenha seu e-mail de recuperação seguro e atualizado</li>
                                    <li>Se você notar atividade incomum na sua conta, altere a senha imediatamente</li>
                                </ul>
                                
                                <h3>Segurança em múltiplos dispositivos</h3>
                                <p>Quando você faz login em múltiplos dispositivos, cada um recebe seu próprio acesso temporário independente. Isso significa que você pode revogar o acesso de um dispositivo específico sem afetar os outros. Se você perder um dispositivo ou vender um aparelho, pode remover o acesso daquele dispositivo especificamente através das configurações da conta.</p>
                            `
                        },

                            id: 'musicas-protegidas',
                            title: 'Como as músicas ficam protegidas?',
                            content: `
                                <p>A proteção das suas músicas no W.Tracks é implementada através de múltiplas camadas de segurança que trabalham juntas para garantir que seus arquivos de áudio permaneçam privados, seguros e acessíveis apenas para você. Essa proteção abrange desde o momento em que você faz upload dos arquivos até o armazenamento de longo prazo, passando pelo trânsito pela rede e pelo acesso em múltiplos dispositivos.</p>
                                
                                <h3>Criptografia durante o upload</h3>
                                <p>Quando você faz upload de arquivos de áudio para o W.Tracks, a proteção começa imediatamente. Os arquivos são criptografados antes mesmo de deixarem seu dispositivo. Isso significa que:</p>
                                <ul>
                                    <li>O conteúdo dos arquivos é transformado em um formato codificado que não pode ser lido sem a chave de descriptografia correta</li>
                                    <li>A criptografia acontece no seu dispositivo, antes do envio pela rede</li>
                                    <li>Mesmo se alguém interceptasse a comunicação durante o upload, não conseguiria ler o conteúdo dos arquivos</li>
                                    <li>A chave de descriptografia nunca é enviada junto com os arquivos — ela permanece separada e protegida</li>
                                </ul>
                                
                                <h3>Criptografia da conexão (trânsito)</h3>
                                <p>A conexão entre seu dispositivo e os servidores do W.Tracks é criptografada usando os mesmos padrões de segurança que bancos e serviços financeiros usam. É esse o famoso "cadeado" que você vê no navegador — ele indica que toda a comunicação está protegida.</p>
                                
                                <p>Essa criptografia de trânsito significa que:</p>
                                <ul>
                                    <li>Todos os dados enviados e recebidos são codificados durante a viagem pela internet</li>
                                    <li>Mesmo que alguém conseguisse interceptar a comunicação (por exemplo, em uma rede Wi-Fi pública), não conseguiria ler o conteúdo</li>
                                    <li>A criptografia é negociada automaticamente entre seu navegador e os servidores — você não precisa configurar nada</li>
                                    <li>Certificados digitais garantem que você está realmente se comunicando com os servidores do W.Tracks e não com um impostor</li>
                                </ul>
                                
                                <h3>Criptografia no armazenamento</h3>
                                <p>Depois que os arquivos chegam aos servidores do W.Tracks, eles continuam criptografados. O armazenamento em disco também é protegido:</p>
                                <ul>
                                    <li>Os arquivos são armazenados em formato criptografado nos servidores</li>
                                    <li>Apenas o sistema do W.Tracks tem acesso às chaves necessárias para descriptografar os arquivos quando necessário</li>
                                    <li>Mesmo alguém com acesso físico aos servidores não conseguiria ler o conteúdo dos arquivos sem as chaves apropriadas</li>
                                    <li>Backups e cópias de segurança também são criptografados usando as mesmas chaves</li>
                                </ul>
                                
                                <h3>Isolamento de contas (segregação de dados)</h3>
                                <p>Uma das proteções mais importantes é o isolamento completo entre contas de usuários. Cada usuário só tem acesso às próprias músicas e projetos:</p>
                                <ul>
                                    <li>Os dados de cada conta são segregados — não há banco de dados compartilhado onde alguém poderia ver projetos de outros usuários</li>
                                    <li>O sistema de autenticação garante que cada solicitação de acesso seja verificada contra a identidade do usuário</li>
                                    <li>Mesmo administradores do sistema não têm acesso aos arquivos de áudio dos usuários sem autorização explícita</li>
                                    <li>Projetos são vinculados matematicamente à conta do criador — não é possível "acidentalmente" acessar projetos de outra pessoa</li>
                                </ul>
                                
                                <p>Isso significa que ninguém mais consegue ver, baixar ou tocar as tracks de outra pessoa, mesmo estando logado no site. Cada conta é completamente isolada — seus projetos são visíveis apenas para você, e os projetos de outras pessoas são invisíveis para você.</p>
                                
                                <h3>Controle de acesso granular</h3>
                                <p>O sistema de controle de acesso é granular e específico. Quando você faz uma solicitação — por exemplo, abrir um projeto — o sistema verifica:</p>
                                <ul>
                                    <li>Quem está fazendo a solicitação (sua identidade)</li>
                                    <li>Se essa identidade tem permissão para acessar o recurso específico solicitado</li>
                                    <li>Se a solicitação está dentro de padrões normais de uso</li>
                                    <li>Se não há bloqueios ou restrições na conta</li>
                                </ul>
                                
                                <p>Essa verificação acontece para cada operação, não apenas no login. Mesmo que alguém obtivesse seu acesso temporário, não conseguiria acessar projetos de outros usuários porque o sistema verificaria que aquele acesso não tem permissão para aqueles recursos específicos.</p>
                                
                                <h3>Privacidade dos arquivos de áudio</h3>
                                <div class="info-box">
                                    <strong>Privacidade garantida:</strong> Seus arquivos de áudio são privados. Não compartilhamos suas músicas com outros usuários, elas não ficam visíveis em nenhum lugar público do site, e não são usados para treinamento de sistemas ou outros propósitos sem seu consentimento explícito.
                                </div>
                                
                                <p>Além da segurança técnica, há garantias de privacidade:</p>
                                <ul>
                                    <li>Seus arquivos não são indexados por mecanismos de busca públicos</li>
                                    <li>Não há galerias ou bibliotecas públicas onde outros usuários possam ver seus projetos</li>
                                    <li>O W.Tracks não vende ou compartilha seus dados com terceiros</li>
                                    <li>Você tem controle completo sobre quem pode acessar seus projetos (no futuro, recursos de compartilhamento permitirão convidar colaboradores específicos)</li>
                                </ul>
                                
                                <h3>Proteção contra acesso não autorizado</h3>
                                <p>O sistema implementa múltiplas proteções contra acesso não autorizado:</p>
                                <ul>
                                    <li><strong>Rate limiting:</strong> Limita o número de tentativas de acesso para evitar ataques de força bruta</li>
                                    <li><strong>Validação de entrada:</strong> Todas as entradas são validadas para evitar injeção de código ou outros ataques</li>
                                    <li><strong>Monitoramento:</strong> Atividades suspeitas são detectadas e podem bloquear acessos automaticamente</li>
                                    <li><strong>Revisão de segurança:</strong> O sistema é regularmente auditado por especialistas em segurança</li>
                                </ul>
                                
                                <h3>Backup e recuperação</h3>
                                <p>Seus arquivos são protegidos contra perda através de sistemas robustos de backup:</p>
                                <ul>
                                    <li>Backups automáticos são feitos regularmente em múltiplas localizações</li>
                                    <li>Os backups também são criptografados usando as mesmas chaves</li>
                                    <li>Em caso de falha de hardware, seus dados podem ser restaurados dos backups</li>
                                    <li>O sistema é projetado para alta disponibilidade — é improvável que você perca dados devido a falhas técnicas</li>
                                </ul>
                                
                                <h3>Seus direitos sobre seus dados</h3>
                                <p>Você mantém direitos completos sobre seus arquivos de áudio:</p>
                                <ul>
                                    <li>Você pode baixar seus arquivos a qualquer momento (recursos de exportação)</li>
                                    <li>Você pode excluir seus projetos e arquivos quando desejar</li>
                                    <li>Se você excluir sua conta, todos os seus dados são removidos dos servidores</li>
                                    <li>Você pode solicitar uma cópia dos seus dados para portabilidade</li>
                                </ul>
                                
                                <h3>Transparência sobre segurança</h3>
                                <p>O W.Tracks é transparente sobre suas práticas de segurança:</p>
                                <ul>
                                    <li>Políticas de privacidade claras explicam como seus dados são usados</li>
                                    <li>Notificações são enviadas sobre alterações significativas nas políticas</li>
                                    <li>Você pode entrar em contato com a equipe de segurança para dúvidas específicas</li>
                                    <li>Vulnerabilidades de segurança são tratadas com prioridade máxima</li>
                                </ul>
                                
                                <h3>Compartilhamento e colaboração (futuro)</h3>
                                <p>No futuro, o W.Tracks pode implementar recursos de compartilhamento e colaboração. Quando isso acontecer, a segurança permanecerá prioritária:</p>
                                <ul>
                                    <li>Compartilhamento será explícito — você terá que conviar pessoas específicas</li>
                                    <li>Você poderá definir níveis de permissão (visualização, edição, download)</li>
                                    <li>Poderá revogar acesso a qualquer momento</li>
                                    <li>Logs de atividade mostrarão quem acessou seus projetos e quando</li>
                                </ul>
                                
                                <p>Até que esses recursos estejam disponíveis, seus projetos permanecem completamente privados e acessíveis apenas para você.</p>

        // ========================================
        // RENDERIZAÇÃO DA SIDEBAR
        // ========================================
        function renderSidebar() {
            const sidebar = document.getElementById('helpSidebar');
            sidebar.innerHTML = '';
            
            helpData.topics.forEach(topic => {
                const section = document.createElement('div');
                section.className = 'help-sidebar-section';
                
                const title = document.createElement('div');
                title.className = 'help-sidebar-title';
                title.innerHTML = `
                    ${topic.title}
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 9l6 6 6-6"/>
                    </svg>
                `;
                title.onclick = () => toggleTopic(topic.id);
                
                const questionsList = document.createElement('div');
                questionsList.className = 'help-sidebar-questions';
                questionsList.id = `questions-${topic.id}`;
                
                topic.questions.forEach(question => {
                    const questionLink = document.createElement('a');
                    questionLink.className = 'help-sidebar-question';
                    questionLink.textContent = question.title;
                    questionLink.onclick = () => showQuestion(question.id);
                    questionLink.dataset.questionId = question.id;
                    questionsList.appendChild(questionLink);
                });
                
                section.appendChild(title);
                section.appendChild(questionsList);
                sidebar.appendChild(section);
            });
        }

        // ========================================
        // RENDERIZAÇÃO DO CONTEÚDO
        // ========================================
        function renderContent() {
            const content = document.getElementById('helpContent');
            content.innerHTML = '';

            helpData.topics.forEach(topic => {
                topic.questions.forEach(question => {
                    const article = document.createElement('article');
                    article.className = 'help-article';
                    article.id = `article-${question.id}`;

                    article.innerHTML = `
                        <div class="help-back-btn" onclick="showDefaultView()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 12H5M12 19l-7-7 7-7"/>
                            </svg>
                            Voltar
                        </div>
                        <h2 class="help-article-title">${question.title}</h2>
                        <div class="help-article-content">${question.content}</div>
                    `;

                    content.appendChild(article);
                });
            });

            // Tela inicial
            const defaultView = document.createElement('div');
            defaultView.className = 'help-article active';
            defaultView.id = 'default-view';
            defaultView.innerHTML = `
                <h2 class="help-article-title">Bem-vindo à Central de Ajuda</h2>
                <div class="help-article-content">
                    <p>Selecione um tópico na barra lateral para encontrar respostas para suas dúvidas sobre o W.Tracks.</p>
                    <p>Você também pode usar a barra de busca acima para encontrar informações específicas rapidamente.</p>
                </div>
            `;
            content.appendChild(defaultView);
        }

        // ========================================
        // NAVEGAÇÃO
        // ========================================
        function toggleTopic(topicId) {
            const questionsList = document.getElementById(`questions-${topicId}`);
            const title = questionsList.previousElementSibling;
            
            questionsList.classList.toggle('expanded');
            title.classList.toggle('expanded');
        }

        function showQuestion(questionId) {
            // Remove active de todos
            document.querySelectorAll('.help-sidebar-question').forEach(q => q.classList.remove('active'));
            document.querySelectorAll('.help-article').forEach(a => a.classList.remove('active'));

            // Adiciona active ao selecionado
            const questionLink = document.querySelector(`[data-question-id="${questionId}"]`);
            if (questionLink) questionLink.classList.add('active');

            const article = document.getElementById(`article-${questionId}`);
            if (article) article.classList.add('active');

            // Adiciona event listener para o link de recuperação de senha
            const resetLink = document.getElementById('showResetFormLink');
            if (resetLink) {
                // Remove listener anterior se existir
                const newLink = resetLink.cloneNode(true);
                resetLink.parentNode.replaceChild(newLink, resetLink);
                // Adiciona novo listener
                newLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    console.log('[PASSWORD RESET] Link clicked from showQuestion');
                    showPasswordResetForm();
                });
            }

            // Fecha sidebar no mobile
            closeMobileSidebar();
        }

        function showDefaultView() {
            document.querySelectorAll('.help-sidebar-question').forEach(q => q.classList.remove('active'));
            document.querySelectorAll('.help-article').forEach(a => a.classList.remove('active'));
            
            const defaultView = document.getElementById('default-view');
            if (defaultView) defaultView.classList.add('active');
        }

        // ========================================
        // BUSCA
        // ========================================
        const searchInput = document.getElementById('helpSearchInput');
        const searchResults = document.getElementById('helpSearchResults');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            
            if (query.length < 2) {
                searchResults.classList.remove('active');
                return;
            }
            
            const results = [];
            
            helpData.topics.forEach(topic => {
                topic.questions.forEach(question => {
                    const titleMatch = question.title.toLowerCase().includes(query);
                    const contentMatch = question.content.toLowerCase().includes(query);
                    
                    if (titleMatch || contentMatch) {
                        // Criar excerpt do conteúdo
                        const plainContent = question.content.replace(/<[^>]*>/g, '');
                        let excerpt = plainContent;
                        
                        if (contentMatch) {
                            const index = plainContent.toLowerCase().indexOf(query);
                            if (index !== -1) {
                                const start = Math.max(0, index - 50);
                                const end = Math.min(plainContent.length, index + 100);
                                excerpt = '...' + plainContent.substring(start, end) + '...';
                            }
                        } else {
                            excerpt = plainContent.substring(0, 150) + '...';
                        }
                        
                        results.push({
                            id: question.id,
                            title: question.title,
                            topic: topic.title,
                            excerpt: excerpt
                        });
                    }
                });
            });
            
            if (results.length === 0) {
                searchResults.innerHTML = `
                    <div class="help-no-results">
                        <p>Nenhum resultado encontrado para "${query}"</p>
                        <p style="margin-top: 8px; font-size: 14px;">Tente outros termos ou entre em contato conosco.</p>
                    </div>
                `;
            } else {
                searchResults.innerHTML = results.map(result => `
                    <div class="help-search-result-item" onclick="showQuestion('${result.id}'); searchInput.value = ''; searchResults.classList.remove('active');">
                        <div class="help-result-title">${result.title}</div>
                        <div class="help-result-topic">${result.topic}</div>
                        <div class="help-result-excerpt">${result.excerpt}</div>
                    </div>
                `).join('');
            }
            
            searchResults.classList.add('active');
        });

        // Fechar busca ao clicar fora
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.classList.remove('active');
            }
        });

        // ========================================
        // MOBILE SIDEBAR
        // ========================================
        const mobileMenuToggle = document.getElementById('helpMobileMenuToggle');
        const sidebar = document.getElementById('helpSidebar');
        const sidebarOverlay = document.getElementById('helpSidebarOverlay');

        mobileMenuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('active');
        });

        sidebarOverlay.addEventListener('click', closeMobileSidebar);

        function closeMobileSidebar() {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
        }

        // ========================================
        // INICIALIZAÇÃO
        // ========================================
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            renderContent();

            // Re-add password reset form after content is rendered
            addPasswordResetForm();

            // Add event listener for password reset link after content is rendered
            setTimeout(() => {
                const resetLink = document.getElementById('showResetFormLink');
                console.log('[PASSWORD RESET] Reset link found:', resetLink);
                if (resetLink) {
                    resetLink.addEventListener('click', (e) => {
                        e.preventDefault();
                        console.log('[PASSWORD RESET] Link clicked');
                        showPasswordResetForm();
                    });
                }

                // Check if hash points to password reset
                if (window.location.hash === '#recuperar-senha') {
                    // Show the article first, then user can click the link to open the form
                    showQuestion('recuperar-senha');
                }
            }, 100);
        });

        function addPasswordResetForm() {
            const content = document.getElementById('helpContent');

            // Password Reset Form (Hidden by default)
            const resetForm = document.createElement('div');
            resetForm.id = 'passwordResetForm';
            resetForm.style.display = 'none';
            resetForm.innerHTML = `
                <div class="help-back-btn" onclick="hidePasswordResetForm()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Voltar para a central de ajuda
                </div>

                <h2 class="help-article-title">Recuperar senha</h2>

                <div class="help-article-content">
                    <p>Digite o e-mail cadastrado na sua conta. Enviaremos um link para você redefinir sua senha.</p>

                    <div style="margin-top: var(--spacing-xl);">
                        <label style="display: block; margin-bottom: var(--spacing-sm); color: var(--color-white); font-weight: 500;">E-mail</label>
                        <input type="email" id="resetEmail" placeholder="seu@email.com" style="width: 100%; padding: var(--spacing-md) var(--spacing-lg); background: var(--color-black-card); border: 1px solid var(--border-medium); border-radius: var(--radius-md); color: var(--color-white); font-size: var(--font-size-base); font-family: var(--font-family); outline: none; transition: all var(--transition-fast);">

                        <div id="resetError" style="display: none; color: #ff3b2f; margin-top: var(--spacing-md); font-size: var(--font-size-sm);"></div>
                        <div id="resetSuccess" style="display: none; color: #4ade80; margin-top: var(--spacing-md); font-size: var(--font-size-sm);"></div>

                        <button onclick="sendPasswordResetEmail()" style="margin-top: var(--spacing-lg); padding: var(--spacing-md) var(--spacing-xl); background: var(--color-accent); color: var(--color-black); border: none; border-radius: var(--radius-md); font-weight: 600; font-size: var(--font-size-base); cursor: pointer; transition: all var(--transition-fast);">
                            Enviar link de recuperação
                        </button>
                    </div>
                </div>
            `;

            content.appendChild(resetForm);
        }

        // ========================================
        // RECUPERAÇÃO DE SENHA
        // ========================================
        function showPasswordResetForm() {
            document.getElementById('helpContent').querySelectorAll('.help-article').forEach(el => el.classList.remove('active'));
            document.getElementById('passwordResetForm').style.display = 'block';
        }

        function hidePasswordResetForm() {
            document.getElementById('passwordResetForm').style.display = 'none';
            // Show default article
            showQuestion('recuperar-senha');
        }

        async function sendPasswordResetEmail() {
            const email = document.getElementById('resetEmail').value;
            const errorDiv = document.getElementById('resetError');
            const successDiv = document.getElementById('resetSuccess');

            // Reset messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (!email || !email.includes('@')) {
                errorDiv.textContent = 'Por favor, insira um e-mail válido.';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                // Wait for Firebase to be available (it loads as module)
                let attempts = 0;
                const maxAttempts = 50; // 5 seconds

                while (!window.firebaseAuth && attempts < maxAttempts) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }

                if (!window.firebaseAuth) {
                    errorDiv.textContent = 'Firebase não está disponível. Tente novamente.';
                    errorDiv.style.display = 'block';
                    return;
                }

                const { auth, sendPasswordResetEmail } = window.firebaseAuth;

                await sendPasswordResetEmail(auth, email, {
                    url: window.location.origin + '/reset-password.html',
                    handleCodeInApp: true
                });

                successDiv.textContent = 'E-mail de recuperação enviado! Verifique sua caixa de entrada e Spam.';
                successDiv.style.display = 'block';

                // Clear the email field
                document.getElementById('resetEmail').value = '';

            } catch (error) {
                console.error('[PASSWORD RESET] Error:', error);
                let errorMessage = 'Erro ao enviar e-mail de recuperação.';

                if (error.code === 'auth/user-not-found') {
                    errorMessage = 'Nenhuma conta encontrada com este e-mail.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'E-mail inválido.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMessage = 'Muitas tentativas. Tente novamente em alguns minutos.';
                }

                errorDiv.textContent = errorMessage;
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
