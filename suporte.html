<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte - W.Tracks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="icon-black-transparent.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #000000;
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff, #a0a0a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #a0a0a0;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.3s ease, background 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ffffff;
            background: #222222;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #666666;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ffffff, #e0e0e0);
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #a0a0a0;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 40px;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #ffffff;
        }

        .success-message {
            display: none;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-top: 24px;
        }

        .success-message.show {
            display: block;
        }

        .success-message h3 {
            color: #4ade80;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .success-message p {
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        .error-message {
            display: none;
            background: rgba(255, 59, 47, 0.1);
            border: 1px solid rgba(255, 59, 47, 0.3);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .error-message.show {
            display: block;
        }

        .error-message p {
            color: #ff3b2f;
            font-size: 0.9rem;
        }

        .choice-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 32px;
        }

        .choice-card {
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .choice-card:hover {
            transform: translateY(-4px);
            border-color: #ffffff;
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.1);
        }

        .choice-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #333333, #222222);
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .choice-icon svg {
            width: 32px;
            height: 32px;
            stroke: #ffffff;
        }

        .choice-card h3 {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .choice-card p {
            color: #a0a0a0;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .submit-btn.secondary {
            background: transparent;
            border: 1px solid #333333;
            color: #ffffff;
        }

        .submit-btn.secondary:hover {
            background: #1a1a1a;
            transform: none;
            box-shadow: none;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }

            .header h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Voltar para W.Tracks</a>

        <!-- Tela de Escolha -->
        <div id="choiceScreen">
            <div class="header">
                <h1>Suporte</h1>
                <p>Como podemos ajudar você hoje?</p>
            </div>

            <div class="choice-container">
                <button class="choice-card" onclick="openTelegramSupport()">
                    <div class="choice-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8.9L21 3l-1.9 5.7a8.38 8.38 0 0 1 .9 3.8z"/>
                        </svg>
                    </div>
                    <h3>Suporte via Telegram</h3>
                    <p>Fale diretamente com nossa equipe através do Telegram para atendimento rápido.</p>
                </button>

                <button class="choice-card" onclick="showComplaintForm()">
                    <div class="choice-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                    </div>
                    <h3>Reclamação</h3>
                    <p>Envie uma reclamação formal com seus dados de contato.</p>
                </button>
            </div>
        </div>

        <!-- Formulário de Reclamação -->
        <div id="complaintFormScreen" style="display:none;">
            <div class="header">
                <h1>Reclamação</h1>
                <p>Envie sua reclamação. Entraremos em contato em breve.</p>
            </div>

            <form id="supportForm">
                <div class="error-message" id="errorMessage">
                    <p id="errorText"></p>
                </div>

                <div class="form-group">
                    <label for="name">Nome completo</label>
                    <input type="text" id="name" name="name" required placeholder="Digite seu nome completo">
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">
                </div>

                <div class="form-group">
                    <label for="phone">Telefone (opcional)</label>
                    <input type="tel" id="phone" name="phone" placeholder="(00) 00000-0000">
                </div>

                <div class="form-group">
                    <label for="message">Reclamação</label>
                    <textarea id="message" name="message" required placeholder="Descreva sua reclamação..."></textarea>
                </div>

                <div style="display:flex;gap:12px;">
                    <button type="button" class="submit-btn secondary" onclick="showChoiceScreen()">Voltar</button>
                    <button type="submit" class="submit-btn" id="submitBtn">Enviar Reclamação</button>
                </div>
            </form>

            <div class="success-message" id="successMessage">
                <h3>Reclamação enviada com sucesso!</h3>
                <p>Entraremos em contato em breve através do e-mail fornecido.</p>
            </div>
        </div>


    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, where, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDW6P_V4_LRLRg6-FEe2E7QJa9J3oidY5g",
            authDomain: "wtracks-acff8.firebaseapp.com",
            projectId: "wtracks-acff8",
            storageBucket: "wtracks-acff8.firebasestorage.app",
            messagingSenderId: "719838064855",
            appId: "1:719838064855:web:3c0631a882aac30cf3c092"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Screen switching functions
        window.showChoiceScreen = function() {
            document.getElementById('choiceScreen').style.display = 'block';
            document.getElementById('complaintFormScreen').style.display = 'none';
        };

        window.showComplaintForm = function() {
            document.getElementById('choiceScreen').style.display = 'none';
            document.getElementById('complaintFormScreen').style.display = 'block';
        };

        window.openTelegramSupport = function() {
            const phoneNumber = '5521969632153';
            const message = encodeURIComponent('Olá! Preciso de suporte do WTracks. Poderia me ajudar?');
            const telegramUrl = `https://t.me/+${phoneNumber}?text=${message}`;
            window.open(telegramUrl, '_blank');
        };

        window.showSupportForm = function() {
            // This function is no longer needed, but kept for compatibility
            openTelegramSupport();
        };

        // Complaint form handling
        const complaintForm = document.getElementById('supportForm');
        const complaintSubmitBtn = document.getElementById('submitBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const successMessage = document.getElementById('successMessage');

        complaintForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const message = document.getElementById('message').value;

            complaintSubmitBtn.disabled = true;
            complaintSubmitBtn.textContent = 'Enviando...';
            errorMessage.classList.remove('show');

            try {
                await addDoc(collection(db, 'complaints'), {
                    name,
                    email,
                    phone,
                    message,
                    status: 'pending',
                    createdAt: serverTimestamp()
                });

                complaintForm.reset();
                successMessage.classList.add('show');
                complaintSubmitBtn.textContent = 'Enviado!';

                setTimeout(() => {
                    successMessage.classList.remove('show');
                    complaintSubmitBtn.textContent = 'Enviar Reclamação';
                    complaintSubmitBtn.disabled = false;
                    showChoiceScreen();
                }, 3000);

            } catch (error) {
                console.error('Error submitting complaint:', error);
                errorText.textContent = 'Erro ao enviar reclamação. Tente novamente.';
                errorMessage.classList.add('show');
                complaintSubmitBtn.textContent = 'Enviar Reclamação';
                complaintSubmitBtn.disabled = false;
            }
        });

        // Escape HTML helper
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
