<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Redefinir Senha - W.Tracks</title>
    <meta name="description" content="Redefinir senha do W.Tracks">
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="icon-black-transparent.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--color-black);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
        }

        .reset-container {
            width: 100%;
            max-width: 420px;
            background: var(--color-black-elevated);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-xl);
            padding: var(--spacing-2xl);
            box-shadow: var(--shadow-lg);
        }

        .reset-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .reset-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
        }

        .reset-logo img {
            width: 40px;
            height: 40px;
        }

        .reset-logo span {
            font-size: var(--font-size-xl);
            font-weight: 700;
            color: var(--color-white);
        }

        .reset-title {
            font-size: var(--font-size-2xl);
            font-weight: 700;
            color: var(--color-white);
            margin-bottom: var(--spacing-sm);
        }

        .reset-subtitle {
            font-size: var(--font-size-sm);
            color: var(--color-white-muted);
            line-height: 1.5;
        }

        .reset-form {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .form-label {
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--color-white);
        }

        .form-input {
            padding: var(--spacing-md) var(--spacing-lg);
            background: var(--color-black-card);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            color: var(--color-white);
            font-size: var(--font-size-base);
            font-family: var(--font-family);
            outline: none;
            transition: all var(--transition-fast);
        }

        .form-input:focus {
            border-color: var(--border-strong);
            background: var(--color-black-hover);
        }

        .form-input::placeholder {
            color: var(--color-white-muted);
        }

        .form-input.error {
            border-color: #ff3b2f;
        }

        .form-error {
            font-size: var(--font-size-xs);
            color: #ff3b2f;
            display: none;
        }

        .form-error.visible {
            display: block;
        }

        .form-success {
            font-size: var(--font-size-sm);
            color: #4ade80;
            text-align: center;
            padding: var(--spacing-md);
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: var(--radius-md);
            display: none;
        }

        .form-success.visible {
            display: block;
        }

        .form-button {
            padding: var(--spacing-md) var(--spacing-xl);
            background: var(--color-accent);
            color: var(--color-black);
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: var(--font-size-base);
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: var(--font-family);
        }

        .form-button:hover {
            background: var(--color-white);
            transform: translateY(-2px);
        }

        .form-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            margin-top: var(--spacing-lg);
        }

        .back-link a {
            color: var(--color-white-muted);
            font-size: var(--font-size-sm);
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        .back-link a:hover {
            color: var(--color-white);
        }

        .password-strength {
            margin-top: var(--spacing-xs);
            display: flex;
            gap: 4px;
        }

        .strength-bar {
            flex: 1;
            height: 4px;
            background: var(--border-subtle);
            border-radius: 2px;
            transition: background var(--transition-fast);
        }

        .strength-bar.weak {
            background: #ff3b2f;
        }

        .strength-bar.medium {
            background: #f59e0b;
        }

        .strength-bar.strong {
            background: #4ade80;
        }

        @media (max-width: 480px) {
            .reset-container {
                padding: var(--spacing-xl);
            }

            .reset-title {
                font-size: var(--font-size-xl);
            }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <div class="reset-logo">
                <img src="icon-white-transparent.png" alt="W.Tracks">
                <span>W.Tracks</span>
            </div>
            <h1 class="reset-title">Redefinir Senha</h1>
            <p class="reset-subtitle">Crie uma nova senha segura para sua conta</p>
        </div>

        <div class="reset-form">
            <div class="form-group">
                <label class="form-label" for="newPassword">Nova senha</label>
                <input type="password" id="newPassword" class="form-input" placeholder="Mínimo 6 caracteres">
                <div class="password-strength" id="passwordStrength">
                    <div class="strength-bar"></div>
                    <div class="strength-bar"></div>
                    <div class="strength-bar"></div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirmar senha</label>
                <input type="password" id="confirmPassword" class="form-input" placeholder="Digite a senha novamente">
                <div class="form-error" id="confirmError">As senhas não coincidem</div>
            </div>

            <div class="form-error" id="generalError"></div>
            <div class="form-success" id="successMessage">
                Senha redefinida com sucesso!
            </div>

            <button class="form-button" id="resetButton" onclick="resetPassword()">Redefinir senha</button>
        </div>

        <div class="back-link">
            <a href="index.html">Voltar para o W.Tracks</a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
      import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

      const firebaseConfig = {
        apiKey: "AIzaSyDW6P_V4_LRLRg6-FEe2E7QJa9J3oidY5g",
        authDomain: "wtracks-acff8.firebaseapp.com",
        projectId: "wtracks-acff8",
        storageBucket: "wtracks-acff8.firebasestorage.app",
        messagingSenderId: "719838064855",
        appId: "1:719838064855:web:3c0631a882aac30cf3c092"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      // Expose Firebase Auth globally
      window.firebaseAuth = { auth, verifyPasswordResetCode, confirmPasswordReset };
    </script>

    <script>
        // Get action code from URL
        const urlParams = new URLSearchParams(window.location.search);
        const actionCode = urlParams.get('oobCode');

        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const resetButton = document.getElementById('resetButton');
        const generalError = document.getElementById('generalError');
        const successMessage = document.getElementById('successMessage');
        const confirmError = document.getElementById('confirmError');
        const passwordStrength = document.getElementById('passwordStrength');

        // Check if action code is present
        if (!actionCode) {
            generalError.textContent = 'Link inválido ou expirado. Solicite uma nova recuperação de senha.';
            generalError.classList.add('visible');
            resetButton.disabled = true;
        }

        // Password strength indicator
        newPasswordInput.addEventListener('input', () => {
            const password = newPasswordInput.value;
            const bars = passwordStrength.querySelectorAll('.strength-bar');

            bars.forEach(bar => {
                bar.classList.remove('weak', 'medium', 'strong');
            });

            if (password.length === 0) {
                return;
            }

            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password) && /[a-z]/.test(password) && /[0-9]/.test(password)) strength++;

            if (strength === 1) {
                bars[0].classList.add('weak');
            } else if (strength === 2) {
                bars[0].classList.add('medium');
                bars[1].classList.add('medium');
            } else if (strength === 3) {
                bars[0].classList.add('strong');
                bars[1].classList.add('strong');
                bars[2].classList.add('strong');
            }
        });

        async function resetPassword() {
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Reset errors
            generalError.classList.remove('visible');
            confirmError.classList.remove('visible');
            newPasswordInput.classList.remove('error');
            confirmPasswordInput.classList.remove('error');

            // Validation
            if (!newPassword || newPassword.length < 6) {
                generalError.textContent = 'A senha deve ter pelo menos 6 caracteres.';
                generalError.classList.add('visible');
                newPasswordInput.classList.add('error');
                return;
            }

            if (newPassword !== confirmPassword) {
                confirmError.classList.add('visible');
                confirmPasswordInput.classList.add('error');
                return;
            }

            resetButton.disabled = true;
            resetButton.textContent = 'Redefinindo...';

            try {
                // Wait for Firebase to be available (it loads as module)
                let attempts = 0;
                const maxAttempts = 50; // 5 seconds

                while (!window.firebaseAuth && attempts < maxAttempts) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }

                if (!window.firebaseAuth) {
                    throw new Error('Firebase não está disponível');
                }

                const { auth, verifyPasswordResetCode, confirmPasswordReset } = window.firebaseAuth;

                // Verify the code
                const email = await verifyPasswordResetCode(auth, actionCode);

                // Confirm the password reset
                await confirmPasswordReset(auth, actionCode, newPassword);

                // Show success
                successMessage.classList.add('visible');
                resetButton.style.display = 'none';
                newPasswordInput.disabled = true;
                confirmPasswordInput.disabled = true;

                // Redirect after 3 seconds
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);

            } catch (error) {
                console.error('[PASSWORD RESET] Error:', error);
                resetButton.disabled = false;
                resetButton.textContent = 'Redefinir senha';

                let errorMessage = 'Erro ao redefinir senha.';

                if (error.code === 'auth/expired-action-code') {
                    errorMessage = 'Link expirado. Solicite uma nova recuperação de senha.';
                } else if (error.code === 'auth/invalid-action-code') {
                    errorMessage = 'Link inválido. Solicite uma nova recuperação de senha.';
                } else if (error.code === 'auth/user-disabled') {
                    errorMessage = 'Esta conta foi desativada.';
                } else if (error.code === 'auth/user-not-found') {
                    errorMessage = 'Usuário não encontrado.';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = 'A senha é muito fraca. Use uma senha mais forte.';
                }

                generalError.textContent = errorMessage;
                generalError.classList.add('visible');
            }
        }
    </script>
</body>
</html>
