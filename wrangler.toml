name = "wtracks"
main = "worker.js"
compatibility_date = "2024-01-01"

# R2 Bucket Binding
[[r2_buckets]]
bucket_name = "wtracks-audio"
binding = "wtracks_audio"

# Environment variables (set as secrets in production)
# Run: wrangler secret put FIREBASE_PROJECT_ID
# Run: wrangler secret put FIREBASE_API_KEY
# Run: wrangler secret put STREAM_TOKEN_SECRET