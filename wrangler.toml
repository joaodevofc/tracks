# Cloudflare Worker Configuration for W.Tracks R2 Integration
# 
# DEPLOYMENT INSTRUCTIONS:
# 1. Install Wrangler CLI: npm install -g wrangler
# 2. Login to Cloudflare: wrangler login
# 3. Configure the bucket name below to match your existing R2 bucket
# 4. Set FIREBASE_PROJECT_ID to your Firebase project ID
# 5. Set R2_ACCOUNT_ID to your Cloudflare account ID
# 6. Set R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY for presigned URLs
# 7. Deploy: wrangler deploy
#
# NOTE: R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY are secrets.
# Get them from: https://dash.cloudflare.com/<ACCOUNT_ID>/r2/api-tokens

name = "wtracks-worker"
main = "r2-worker.js"
compatibility_date = "2024-01-01"

# R2 Bucket Binding
# Replace "YOUR_R2_BUCKET_NAME" with your existing R2 bucket name
[[r2_buckets]]
binding = "R2"
bucket_name = "wtracks-audio"

# Public Environment Variables
# These are not secrets and can be committed to Git
[vars]
FIREBASE_PROJECT_ID = "wtracks-acff8"
R2_ACCOUNT_ID = "d0f0b222a505e7b4c087e73ddccc9026"

# Worker Secrets (DO NOT commit these to Git)
# These are required for presigned URL generation
# wrangler secret put R2_ACCESS_KEY_ID
# wrangler secret put R2_SECRET_ACCESS_KEY
