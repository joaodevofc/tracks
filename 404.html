<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página não encontrada | W.Tracks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
        }

        .error-code {
            font-size: 120px;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            margin-bottom: 20px;
            letter-spacing: -4px;
        }

        .error-title {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 16px;
        }

        .error-message {
            font-size: 16px;
            color: #888;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #fff;
            color: #000;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
            margin-right: 10px;
        }

        .btn:hover {
            background: #888;
            color: #000;
        }

        .btn-secondary {
            background: transparent;
            color: #888;
            border: 1px solid #333;
        }

        .btn-secondary:hover {
            background: #333;
            color: #fff;
        }

        .illustration {
            margin-bottom: 32px;
        }

        .illustration svg {
            width: 120px;
            height: 120px;
            opacity: 0.5;
        }

        .dev-panel {
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: none;
        }

        .dev-panel.active {
            display: block;
        }

        .dev-panel input {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
            margin-bottom: 10px;
        }

        .dev-panel button {
            width: 100%;
            padding: 10px;
            background: #4ade80;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="illustration">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        </div>
        <div class="error-code">404</div>
        <h1 class="error-title">Página não encontrada</h1>
        <p class="error-message">
            A página que você está procurando não existe ou foi movida para outro lugar.
        </p>
        <a href="/" class="btn">Voltar para o início</a>
        <button class="btn btn-secondary" id="devToggle">Painel Dev</button>
        
        <div class="dev-panel" id="devPanel">
            <input type="text" id="devKey" placeholder="Chave de desenvolvimento">
            <button id="devSubmit">Reativar site</button>
        </div>
    </div>

    <script>
        const DEV_MODE_SECRET_UID = 'CesU7HhFpFPCzDGBZHrn4pNEygr2';
        
        // Check if dev mode is active - if so, allow bypass
        const devMode = localStorage.getItem('wtracks_dev_mode');
        if (devMode === 'true') {
            localStorage.removeItem('wtracks_maintenance_mode');
            window.location.href = '/';
        }
        
        document.getElementById('devToggle').addEventListener('click', () => {
            document.getElementById('devPanel').classList.toggle('active');
        });

        document.getElementById('devSubmit').addEventListener('click', () => {
            const key = document.getElementById('devKey').value;
            if (key === DEV_MODE_SECRET_UID) {
                localStorage.removeItem('wtracks_maintenance_mode');
                localStorage.setItem('wtracks_dev_mode', 'true');
                window.location.href = '/';
            } else {
                alert('Chave inválida');
            }
        });
    </script>
</body>
</html>
